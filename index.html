<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-density="comfortable">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Горизонт — архив обоев Bing</title>
<meta name="description" content="Минималистичный архив ежедневных фоновых изображений Bing в разрешении 4K UHD.">
<meta name="color-scheme" content="dark light">
<meta id="metaTheme" name="theme-color" content="#0b0d11">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d11'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%232e4a7d'/%3E%3Cstop offset='.55' stop-color='%23c96f4a'/%3E%3Cstop offset='1' stop-color='%23f4d9a6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='27' r='6' fill='%23e8a33d'/%3E%3Crect x='10' y='37' width='44' height='3' rx='1.5' fill='url(%23g)'/%3E%3C/svg%3E">
<script>
(function(){var t,d;try{t=localStorage.getItem('gorizont:theme');d=localStorage.getItem('gorizont:density')}catch(e){}
document.documentElement.dataset.theme=(t==='light')?'light':'dark';
document.documentElement.dataset.density=(d==='compact')?'compact':'comfortable';})();
</script>
<style>
/* ---------- Токены ---------- */
:root{
  --topH:58px;
  --horizon:linear-gradient(90deg,#2e4a7d,#6d5a9e,#c96f4a,#e8a33d,#f4d9a6);
  --accent:#e8a33d; --accent-ink:#191106;
  --ok:#7fd18f; --ok-ink:#0d1a10;
  --danger:#e06a55;
  --gap:8px; --radius:3px; --cell:372px;
  --lb-bg:rgba(7,9,13,.94); --lb-text:#eef1f5; --lb-muted:#9aa3b2; --lb-faint:#7d8592;
  --lb-line:rgba(255,255,255,.16); --lb-line-hi:rgba(255,255,255,.34);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b0d11; --bg-elev:#12151b; --sk-hi:#181c24;
  --text:#eceff4; --muted:#9aa3b2; --faint:#5f6875;
  --line:rgba(236,239,244,.09); --line-strong:rgba(236,239,244,.2);
  --header-bg:rgba(11,13,17,.8);
  --glow:radial-gradient(900px 320px at 50% -140px,rgba(232,163,61,.07),transparent 70%);
  --shadow:0 30px 90px rgba(0,0,0,.6);
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f5f3ee; --bg-elev:#fdfcf9; --sk-hi:#eceae3;
  --text:#191b1f; --muted:#5f6672; --faint:#8a919c;
  --line:rgba(20,22,26,.1); --line-strong:rgba(20,22,26,.24);
  --header-bg:rgba(245,243,238,.82);
  --glow:radial-gradient(900px 320px at 50% -140px,rgba(192,127,22,.06),transparent 70%);
  --accent:#b0770f;
  --shadow:0 30px 90px rgba(20,18,12,.35);
}
html[data-density="compact"]{--cell:252px}

/* ---------- База ---------- */
*,*::before,*::after{box-sizing:border-box}
html{scrollbar-gutter:stable;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:400 14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
body::before{content:"";position:fixed;inset:0;background:var(--glow);pointer-events:none;z-index:0}
body.locked{overflow:hidden}
img{display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
::selection{background:rgba(232,163,61,.3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
.num{font-variant-numeric:tabular-nums}

/* Скроллбар в палитре сайта */
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--faint)}

/* ---------- Шапка ---------- */
.top{
  position:fixed;top:0;left:0;right:0;height:var(--topH);z-index:50;
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;
  background:var(--header-bg);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  animation:topIn .5s ease both;
}
.top::after{ /* линия горизонта — единственный декор */
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:var(--horizon);background-size:260% 100%;transform-origin:left;
  animation:lineIn .9s cubic-bezier(.22,.61,.36,1) .15s both,drift 36s ease-in-out 1.2s infinite alternate;
}
html[data-theme="dark"] .top::after{box-shadow:0 0 14px rgba(232,163,61,.3),0 1px 10px rgba(201,111,74,.2)}
.brand{display:flex;align-items:center;gap:11px;user-select:none}
.sun{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4d9a6,#e8a33d 60%,#c96f4a);box-shadow:0 0 10px rgba(232,163,61,.55)}
.wordmark{font-size:12px;font-weight:600;letter-spacing:.42em;text-transform:uppercase}
.top-right{display:flex;align-items:center;gap:12px}
.count{font-size:12px;color:var(--muted);white-space:nowrap}
.seg{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px}
.seg button{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--bg-elev);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-strong)}
.tbtn{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;color:var(--text);transition:border-color .15s,background .15s}
.tbtn:hover{border-color:var(--line-strong);background:var(--bg-elev)}

/* ---------- Контент ---------- */
main{position:relative;z-index:1;padding:calc(var(--topH) + 26px) 20px 40px}
.caption{margin:0 0 16px;font-size:12.5px;color:var(--muted);letter-spacing:.02em;animation:fadeUp .6s ease .1s both}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--cell)),1fr));gap:var(--gap)}
.cell{
  position:relative;display:block;width:100%;aspect-ratio:16/9;overflow:hidden;
  border-radius:var(--radius);background:var(--bg-elev);border:1px solid var(--line);
  cursor:zoom-in;opacity:0;transform:translateY(14px);
  transition:opacity .55s ease var(--d,0ms),transform .55s cubic-bezier(.22,.61,.36,1) var(--d,0ms),border-color .25s ease;
}
.cell.in{opacity:1;transform:none}
.cell:focus-visible{outline-offset:3px}
.cell img{width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.02);transition:opacity .6s ease,transform 1s cubic-bezier(.2,.6,.2,1)}
.cell.loaded img{opacity:1;transform:none}
@media (hover:hover){
  .cell:hover{border-color:var(--line-strong)}
  .cell:hover img{transform:scale(1.045)}
}
.cell.peek{border-color:var(--accent)}
.cell.failed{cursor:default}
.cell.failed img{display:none}
.cell.failed::after{content:"недоступно";position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.skel{cursor:default;opacity:1;transform:none;background:linear-gradient(100deg,var(--bg-elev) 40%,var(--sk-hi) 50%,var(--bg-elev) 60%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}

.sentinel{display:grid;place-items:center;padding:30px 0}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--accent);animation:rot .7s linear infinite}
.endcap{text-align:center;padding:34px 0 4px}
.end-line{display:block;width:64px;height:2px;margin:0 auto;background:var(--horizon);border-radius:2px;opacity:.85}
.endcap p{margin:12px 0 0;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--faint)}

/* Ошибка */
.error{max-width:420px;margin:70px auto;text-align:center;padding:34px 28px;border:1px solid var(--line);border-radius:12px;background:var(--bg-elev)}
.error h2{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--danger)}
.error p{margin:0 0 18px;font-size:13px;color:var(--muted)}
.error code{display:block;margin:0 0 18px;padding:10px;border-radius:8px;background:var(--bg);font-size:12px;color:var(--muted)}
.btn-solid{display:inline-flex;align-items:center;height:38px;padding:0 20px;border-radius:999px;background:var(--text);color:var(--bg);font-size:13px;font-weight:600;transition:background .18s,color .18s}
.btn-solid:hover{background:var(--accent);color:var(--accent-ink)}

/* Подвал */
footer{position:relative;z-index:1;padding:26px 20px 56px;text-align:center;font-size:11.5px;color:var(--faint)}
footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line-strong);transition:color .15s,border-color .15s}
footer a:hover{color:var(--accent);border-color:var(--accent)}

/* Наверх */
.totop{
  position:fixed;right:18px;bottom:18px;z-index:40;width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;background:var(--bg-elev);border:1px solid var(--line-strong);color:var(--muted);
  opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .25s,transform .25s,color .15s,border-color .15s;
}
.totop.show{opacity:1;pointer-events:auto;transform:none}
.totop:hover{color:var(--accent);border-color:var(--accent)}

/* ---------- Лайтбокс (всегда «кино-тёмный») ---------- */
dialog#lightbox{
  position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;
  background:var(--lb-bg);color:var(--lb-text);overflow:hidden;
  backdrop-filter:blur(12px) saturate(.9);-webkit-backdrop-filter:blur(12px) saturate(.9);
}
dialog#lightbox[open]{display:block;animation:lbIn .25s ease both}
dialog#lightbox.closing{opacity:0;transition:opacity .18s ease}
dialog#lightbox::backdrop{background:transparent}
dialog#lightbox:focus{outline:none}
.lb-top{
  position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;background:linear-gradient(180deg,rgba(7,9,13,.75),transparent);
}
.lb-meta{display:flex;align-items:baseline;white-space:nowrap}
#lbDate{font-size:12.5px;color:#d6dae1}
.lb-count{margin-left:12px;font-size:12px;color:var(--lb-muted)}
.lb-actions{display:flex;gap:8px}
.ic-btn{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#e7eaef;
  border:1px solid var(--lb-line);background:rgba(255,255,255,.06);
  transition:background .15s,border-color .15s,transform .12s;
}
.ic-btn:hover{background:rgba(255,255,255,.14);border-color:var(--lb-line-hi)}
.ic-btn:active{transform:scale(.95)}
.lb-stage{position:absolute;inset:0;z-index:1;display:grid;place-items:center;padding:66px 84px 108px;touch-action:pan-y pinch-zoom}
.lb-loader{position:absolute;inset:0;display:none;place-items:center;z-index:0}
.lb-stage.loading .lb-loader{display:grid}
.spin-lg{width:26px;height:26px;border-color:rgba(255,255,255,.2);border-top-color:var(--accent)}
#lbImg{
  position:relative;z-index:1;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;
  border-radius:3px;box-shadow:var(--shadow);cursor:zoom-in;user-select:none;-webkit-user-drag:none;
  transition:opacity .22s ease;
}
#lbImg.fade{opacity:0}
dialog#lightbox:fullscreen #lbImg{cursor:zoom-out}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:46px;height:46px}
.lb-nav.prev{left:16px}
.lb-nav.next{right:16px}
.lb-nav:active{transform:translateY(-50%) scale(.94)}
.lb-bottom{
  position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:14px 16px 18px;background:linear-gradient(0deg,rgba(7,9,13,.8),transparent);
}
.dl{
  display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 22px;border-radius:999px;
  background:#eef1f5;color:#101319;font-size:13.5px;font-weight:600;text-decoration:none;
  box-shadow:0 6px 24px rgba(0,0,0,.35);transition:background .18s,color .18s,border-color .18s,transform .12s;
  border:1px solid transparent;
}
.dl:hover{background:var(--accent);color:var(--accent-ink)}
.dl:active{transform:scale(.97)}
.dl .spin{width:14px;height:14px;border-color:rgba(16,19,25,.25);border-top-color:currentColor;display:none}
.dl[data-state="loading"]{opacity:.75;pointer-events:none}
.dl[data-state="loading"] .dl-svg{display:none}
.dl[data-state="loading"] .spin{display:block}
.dl[data-state="success"]{background:var(--ok);color:var(--ok-ink)}
.dl[data-state="open"]{background:transparent;border-color:var(--lb-line-hi);color:#eef1f5;box-shadow:none}
.dl[data-state="open"]:hover{border-color:var(--accent);color:var(--accent)}
.lb-status{min-height:15px;font-size:11.5px;color:var(--lb-muted)}
.lb-status.pulse{animation:pulse 1.4s ease-in-out infinite}
.lb-hints{position:absolute;left:16px;bottom:14px;z-index:3;font-size:10.5px;letter-spacing:.04em;color:var(--lb-faint)}

/* ---------- Анимации ---------- */
@keyframes topIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes lineIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drift{from{background-position:0% 0}to{background-position:100% 0}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes lbIn{from{opacity:0}to{opacity:1}}

/* ---------- Адаптив ---------- */
@media (max-width:760px){
  main{padding-left:10px;padding-right:10px}
  :root{--gap:6px}
  .caption{font-size:12px;margin-bottom:12px}
  .lb-nav,.lb-hints{display:none}
  .lb-stage{padding:58px 10px 122px}
  .lb-top{padding:10px 12px}
  .lb-bottom{padding:12px 12px 16px}
  .ic-btn{width:38px;height:38px}
}
@media (max-width:560px){
  .count{display:none}
  .wordmark{letter-spacing:.3em}
}
@media (max-height:520px){
  .lb-stage{padding:48px 70px 92px}
  .lb-hints{display:none}
  .lb-top{padding:8px 12px}
  .lb-bottom{padding:8px 12px 10px}
  .dl{height:38px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .cell{opacity:1;transform:none}
  .top::after{animation:none}
}
noscript .error{display:block}
</style>
</head>
<body>

<!-- Иконки -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
  <symbol id="i-grid2" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.2"/><rect x="13" y="4" width="7" height="7" rx="1.2"/><rect x="4" y="13" width="7" height="7" rx="1.2"/><rect x="13" y="13" width="7" height="7" rx="1.2"/></symbol>
  <symbol id="i-grid3" viewBox="0 0 24 24"><rect x="4" y="4" width="3.4" height="3.4" rx=".9"/><rect x="10.3" y="4" width="3.4" height="3.4" rx=".9"/><rect x="16.6" y="4" width="3.4" height="3.4" rx=".9"/><rect x="4" y="10.3" width="3.4" height="3.4" rx=".9"/><rect x="10.3" y="10.3" width="3.4" height="3.4" rx=".9"/><rect x="16.6" y="10.3" width="3.4" height="3.4" rx=".9"/><rect x="4" y="16.6" width="3.4" height="3.4" rx=".9"/><rect x="10.3" y="16.6" width="3.4" height="3.4" rx=".9"/><rect x="16.6" y="16.6" width="3.4" height="3.4" rx=".9"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-chevL" viewBox="0 0 24 24"><path d="M14.5 6 8.5 12l6 6"/></symbol>
  <symbol id="i-chevR" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
  <symbol id="i-compress" viewBox="0 0 24 24"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l5 5L19 7.5"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M18 13.5V19H5V6h5.5M14.5 4.5h5v5M19 5l-8.5 8.5"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
</svg>

<header class="top">
  <div class="brand"><span class="sun" aria-hidden="true"></span><span class="wordmark">Горизонт</span></div>
  <div class="top-right">
    <span id="count" class="count num" title="Всего изображений в архиве">…</span>
    <div class="seg" role="group" aria-label="Размер превью">
      <button type="button" data-density="comfortable" title="Крупные превью" aria-label="Крупные превью"><svg class="icon" width="16" height="16" aria-hidden="true"><use href="#i-grid2"/></svg></button>
      <button type="button" data-density="compact" title="Мелкие превью" aria-label="Мелкие превью"><svg class="icon" width="16" height="16" aria-hidden="true"><use href="#i-grid3"/></svg></button>
    </div>
    <button type="button" id="themeBtn" class="tbtn" title="Светлая тема" aria-label="Светлая тема"><svg class="icon" width="17" height="17" aria-hidden="true"><use id="themeIcon" href="#i-sun"/></svg></button>
  </div>
</header>

<main>
  <p class="caption">Ежедневные обои Bing · 4K UHD · сначала новые</p>
  <section id="grid" class="grid" aria-label="Архив обоев"></section>
  <div id="sentinel" class="sentinel" aria-hidden="true"><span class="spin"></span></div>
  <div id="endcap" class="endcap" hidden><span class="end-line"></span><p>Начало архива</p></div>
  <div id="error" class="error" hidden>
    <h2>Не удалось загрузить архив</h2>
    <p id="errMsg">Проверьте соединение и попробуйте ещё раз.</p>
    <code id="errHint" hidden>python -m http.server 8000</code>
    <button type="button" id="retryBtn" class="btn-solid">Повторить</button>
  </div>
</main>

<footer>Горизонт · изображения Bing и их авторы · <a href="https://github.com/Rammsystem/Gorizont" target="_blank" rel="noopener">GitHub</a></footer>

<button type="button" id="toTop" class="totop" title="Наверх" aria-label="Наверх"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="#i-up"/></svg></button>

<dialog id="lightbox" tabindex="-1" aria-label="Просмотр изображения">
  <div class="lb-top">
    <div class="lb-meta"><span id="lbDate"></span><span id="lbCount" class="lb-count num"></span></div>
    <div class="lb-actions">
      <button type="button" id="fsBtn" class="ic-btn" title="Полный экран (F)" aria-label="Полный экран"><svg class="icon" width="18" height="18" aria-hidden="true"><use id="fsIcon" href="#i-expand"/></svg></button>
      <button type="button" id="closeBtn" class="ic-btn" title="Закрыть (Esc)" aria-label="Закрыть"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
  </div>
  <div class="lb-stage" id="stage">
    <div class="lb-loader" aria-hidden="true"><span class="spin spin-lg"></span></div>
    <img id="lbImg" class="fade" alt="" draggable="false">
  </div>
  <button type="button" id="prevBtn" class="ic-btn lb-nav prev" title="Предыдущее (←)" aria-label="Предыдущее изображение"><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-chevL"/></svg></button>
  <button type="button" id="nextBtn" class="ic-btn lb-nav next" title="Следующее (→)" aria-label="Следующее изображение"><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-chevR"/></svg></button>
  <div class="lb-bottom">
    <a id="dlBtn" class="dl" data-state="idle" href="#" target="_blank" rel="noopener" title="Скачать в 4K" aria-label="Скачать UHD">
      <svg class="icon dl-svg" width="16" height="16" aria-hidden="true"><use id="dlIcon" href="#i-download"/></svg>
      <span class="spin" aria-hidden="true"></span>
      <span id="dlLabel">Скачать UHD</span>
    </a>
    <span id="lbStatus" class="lb-status num" aria-live="polite"></span>
  </div>
  <div class="lb-hints" aria-hidden="true">← → · F — экран · D — скачать · Esc — закрыть</div>
</dialog>

<noscript><div class="error" style="position:fixed;inset:auto 16px;top:40%;z-index:99"><h2>Нужен JavaScript</h2><p>Для работы архива необходим JavaScript.</p></div></noscript>

<script>
(function(){'use strict';
const $=s=>document.querySelector(s);
const html=document.documentElement;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const grid=$('#grid'),sentinel=$('#sentinel'),endcap=$('#endcap'),errorBox=$('#error'),errMsg=$('#errMsg'),errHint=$('#errHint'),countEl=$('#count');
const dialog=$('#lightbox'),stage=$('#stage'),lbImg=$('#lbImg'),lbDate=$('#lbDate'),lbCount=$('#lbCount'),lbStatus=$('#lbStatus');
const dlBtn=$('#dlBtn'),dlIcon=$('#dlIcon'),dlLabel=$('#dlLabel'),fsBtn=$('#fsBtn'),fsIcon=$('#fsIcon');
const toTop=$('#toTop'),themeBtn=$('#themeBtn'),themeIcon=$('#themeIcon');
const segBtns=[...document.querySelectorAll('.seg button')];

const BATCH=48;
let entries=[],total=0,rendered=0,cur=0,openedIdx=0,navToken=0,closing=false,lastFocus=null;
let revealIO=null,sentIO=null;
const dl={busy:false,cors:false,ctrl:null};
const dateCache=new Map();
const fmt=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'});

function human(e){
  if(dateCache.has(e.img_id))return dateCache.get(e.img_id);
  const m=/^(\d{4})(\d{2})(\d{2})/.exec(e.sort_key||'');
  const s=m?fmt.format(new Date(+m[1],+m[2]-1,+m[3])).replace(' г.',''):'Без даты';
  dateCache.set(e.img_id,s);return s;
}
function plural(n,f){const a=n%10,b=n%100;return a===1&&b!==11?f[0]:a>=2&&a<=4&&(b<12||b>14)?f[1]:f[2]}

/* ---------- Тема и сетка ---------- */
function applyTheme(t){
  html.dataset.theme=t;
  $('#metaTheme').content=t==='light'?'#f5f3ee':'#0b0d11';
  themeIcon.setAttribute('href',t==='light'?'#i-moon':'#i-sun');
  const lbl=t==='light'?'Тёмная тема':'Светлая тема';
  themeBtn.title=lbl;themeBtn.setAttribute('aria-label',lbl);
  try{localStorage.setItem('gorizont:theme',t)}catch(e){}
}
themeBtn.addEventListener('click',()=>applyTheme(html.dataset.theme==='light'?'dark':'light'));
function applyDensity(d){
  html.dataset.density=d;
  segBtns.forEach(b=>{const on=b.dataset.density===d;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  try{localStorage.setItem('gorizont:density',d)}catch(e){}
}
segBtns.forEach(b=>b.addEventListener('click',()=>applyDensity(b.dataset.density)));
applyTheme(html.dataset.theme||'dark');
applyDensity(html.dataset.density||'comfortable');

/* ---------- Загрузка и рендер ---------- */
function showSkeleton(){
  grid.hidden=false;errorBox.hidden=true;sentinel.hidden=false;endcap.hidden=true;
  grid.innerHTML='';
  const f=document.createDocumentFragment();
  for(let i=0;i<12;i++){const d=document.createElement('div');d.className='cell skel';f.appendChild(d)}
  grid.appendChild(f);
}
function initObservers(){
  if(!revealIO){
    revealIO=new IntersectionObserver(es=>es.forEach(en=>{
      if(en.isIntersecting){en.target.classList.add('in');revealIO.unobserve(en.target)}
    }),{threshold:.05,rootMargin:'0px 0px -20px 0px'});
  }else revealIO.disconnect();
  if(!sentIO){
    sentIO=new IntersectionObserver(es=>{
      if(es[0].isIntersecting&&rendered<total)renderMore();
    },{rootMargin:'1400px 0px'});
  }
  sentIO.observe(sentinel);
}
function renderMore(){
  if(rendered>=total)return;
  const start=rendered,end=Math.min(total,rendered+BATCH);
  const f=document.createDocumentFragment(),cells=[];
  for(let i=start;i<end;i++){
    const e=entries[i];
    const b=document.createElement('button');
    b.type='button';b.className='cell';b.dataset.idx=i;
    b.style.setProperty('--d',Math.min((i-start)*35,320)+'ms');
    b.setAttribute('aria-label','Открыть обои: '+human(e));
    const im=document.createElement('img');
    im.loading='lazy';im.decoding='async';im.alt='';im.draggable=false;im.src=e.preview;
    im.addEventListener('load',()=>b.classList.add('loaded'),{once:true});
    im.addEventListener('error',()=>{b.classList.add('failed');b.disabled=true},{once:true});
    if(im.complete&&im.naturalWidth)b.classList.add('loaded');
    b.appendChild(im);f.appendChild(b);cells.push(b);
  }
  grid.appendChild(f);
  cells.forEach(c=>revealIO.observe(c));
  rendered=end;
  if(rendered>=total){sentinel.hidden=true;endcap.hidden=false;sentIO&&sentIO.unobserve(sentinel)}
}
function ensureRendered(n){while(rendered<n&&rendered<total)renderMore()}

async function boot(){
  showSkeleton();countEl.textContent='…';
  try{
    const r=await fetch('data.json',{cache:'no-cache'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    entries=Object.values(data).filter(e=>e&&e.url&&e.preview)
      .sort((a,b)=>String(b.sort_key||'').localeCompare(String(a.sort_key||'')));
    if(!entries.length)throw new Error('архив пуст');
    total=entries.length;rendered=0;dateCache.clear();
    grid.innerHTML='';
    countEl.textContent=total+' '+plural(total,['изображение','изображения','изображений']);
    initObservers();renderMore();handleHash();
  }catch(err){
    grid.hidden=true;sentinel.hidden=true;endcap.hidden=true;errorBox.hidden=false;
    errMsg.textContent='Проверьте соединение и попробуйте ещё раз.'+(err&&err.message?' ('+err.message+')':'');
    errHint.hidden=location.protocol!=='file:';
    if(location.protocol==='file:')errMsg.textContent='Откройте сайт через локальный сервер:';
    countEl.textContent='—';
  }
}
$('#retryBtn').addEventListener('click',boot);

grid.addEventListener('click',e=>{
  const c=e.target.closest('.cell');
  if(!c||c.disabled||c.classList.contains('skel'))return;
  openLB(+c.dataset.idx);
});

/* ---------- Хэш-ссылки ---------- */
function setHash(e){try{history.replaceState(null,'','#'+encodeURIComponent(e.img_id))}catch(_){}}
function clearHash(){try{history.replaceState(null,'',location.pathname+location.search)}catch(_){}}
function handleHash(){
  const h=location.hash.slice(1);if(!h)return;
  let id;try{id=decodeURIComponent(h)}catch(_){id=h}
  const i=entries.findIndex(e=>e.img_id===id);
  if(i>=0){ensureRendered(i+1);openLB(i)}
}

/* ---------- Лайтбокс ---------- */
function setStatus(t,pulse){lbStatus.textContent=t;lbStatus.classList.toggle('pulse',!!pulse)}
function setDlState(s){
  dlBtn.dataset.state=s;
  const map={idle:['#i-download','Скачать UHD','Скачать в 4K'],
             loading:['#i-download','Скачивание…',''],
             success:['#i-check','Сохранено',''],
             open:['#i-external','Открыть UHD','Откроется в новой вкладке']};
  const m=map[s];
  dlIcon.setAttribute('href',m[0]);dlLabel.textContent=m[1];dlBtn.title=m[2];dlBtn.setAttribute('aria-label',m[1]);
}
function abortDL(){if(dl.ctrl){dl.ctrl.abort();dl.ctrl=null}}

function openLB(i){
  if(!total)return;
  lastFocus=document.activeElement;openedIdx=i;
  ensureRendered(i+1);
  if(typeof dialog.showModal==='function')dialog.showModal();else dialog.setAttribute('open','');
  document.body.classList.add('locked');
  syncFS();navTo(i);
  dialog.focus({preventScroll:true});
}
function navTo(i){
  cur=((i%total)+total)%total;
  navToken++;const token=navToken;
  abortDL();dl.busy=false;setDlState(dl.cors?'open':'idle');
  const e=entries[cur];
  lbDate.textContent=human(e);
  lbCount.textContent=(cur+1)+' / '+total;
  dlBtn.href=e.url;dlBtn.setAttribute('download',e.img_id+'_UHD.jpg');
  stage.classList.add('loading');lbImg.classList.add('fade');setStatus('');
  const pre=new Image();pre.decoding='async';
  pre.onload=()=>{
    if(token!==navToken)return;
    lbImg.src=e.preview;lbImg.alt='Обои Bing — '+human(e);
    requestAnimationFrame(()=>{if(token!==navToken)return;lbImg.classList.remove('fade');stage.classList.remove('loading')});
    const dims=pre.naturalWidth+' × '+pre.naturalHeight;
    setStatus(dims+' · загрузка 4K…',true);
    loadUHD(e,token,dims);
  };
  pre.onerror=()=>{if(token!==navToken)return;stage.classList.remove('loading');setStatus('Не удалось загрузить изображение')};
  pre.src=e.preview;
  /* соседние превью — в кэш */
  [cur-1,cur+1].forEach(k=>{const n=entries[((k%total)+total)%total];if(n){const p=new Image();p.src=n.preview}});
  setHash(e);
}
function loadUHD(e,token,dims){
  const u=new Image();u.decoding='async';
  u.onload=()=>{if(token!==navToken)return;lbImg.src=e.url;setStatus(u.naturalWidth+' × '+u.naturalHeight+' · UHD')};
  u.onerror=()=>{if(token!==navToken)return;setStatus(dims+' · превью')};
  u.src=e.url;
}
function closeLB(){
  if(!dialog.open||closing)return;
  closing=true;abortDL();navToken++;
  dialog.classList.add('closing');
  setTimeout(()=>{try{dialog.close()}catch(_){dialog.removeAttribute('open')}},RM?0:180);
}
dialog.addEventListener('cancel',e=>{
  e.preventDefault();
  if(document.fullscreenElement||document.webkitFullscreenElement){
    try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(_){}
    return;
  }
  closeLB();
});
dialog.addEventListener('close',()=>{
  closing=false;dialog.classList.remove('closing');
  document.body.classList.remove('locked');
  if(document.fullscreenElement||document.webkitFullscreenElement){
    try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(_){}
  }
  lbImg.removeAttribute('src');lbImg.classList.add('fade');
  stage.classList.remove('loading');setStatus('');clearHash();
  const idx=cur;
  if(idx!==openedIdx){
    ensureRendered(idx+1);
    const cell=grid.querySelector('.cell[data-idx="'+idx+'"]');
    if(cell){requestAnimationFrame(()=>{
      cell.scrollIntoView({block:'center',behavior:'auto'});
      cell.classList.add('peek');setTimeout(()=>cell.classList.remove('peek'),1600);
      cell.focus({preventScroll:true});
    })}
  }else if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});
  lastFocus=null;
});
$('#closeBtn').addEventListener('click',closeLB);
$('#prevBtn').addEventListener('click',()=>navTo(cur-1));
$('#nextBtn').addEventListener('click',()=>navTo(cur+1));

/* Клавиатура (F/D работают и в русской раскладке) */
dialog.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){e.preventDefault();navTo(cur-1)}
  else if(e.key==='ArrowRight'){e.preventDefault();navTo(cur+1)}
  else{
    const k=e.key.toLowerCase();
    if(k==='f'||k==='а'){e.preventDefault();if(fsSupported)toggleFS()}
    else if(k==='d'||k==='в'){e.preventDefault();if(!dl.busy){if(dl.cors)window.open(entries[cur].url,'_blank','noopener');else startDownload()}}
  }
});

/* Свайп и клик по фону */
let px=0,py=0,swiping=false,moved=false;
stage.addEventListener('pointerdown',e=>{if(!e.isPrimary)return;swiping=true;moved=false;px=e.clientX;py=e.clientY;try{stage.setPointerCapture(e.pointerId)}catch(_){}});
stage.addEventListener('pointermove',e=>{if(swiping&&(Math.abs(e.clientX-px)>10||Math.abs(e.clientY-py)>10))moved=true});
stage.addEventListener('pointerup',e=>{
  if(!swiping)return;swiping=false;
  const dx=e.clientX-px,dy=e.clientY-py;
  if(Math.abs(dx)>56&&Math.abs(dx)>Math.abs(dy)*1.2)navTo(cur+(dx<0?1:-1));
});
stage.addEventListener('pointercancel',()=>{swiping=false});
stage.addEventListener('click',e=>{if(e.target===stage&&!moved)closeLB()});
lbImg.addEventListener('dblclick',()=>{if(fsSupported)toggleFS()});

/* Полный экран */
const fsSupported=!!(dialog.requestFullscreen||dialog.webkitRequestFullscreen);
if(!fsSupported)fsBtn.hidden=true;
function toggleFS(){
  if(document.fullscreenElement||document.webkitFullscreenElement){
    try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(_){}
  }else{
    try{(dialog.requestFullscreen||dialog.webkitRequestFullscreen).call(dialog)}catch(_){}
  }
}
function syncFS(){
  const on=!!(document.fullscreenElement||document.webkitFullscreenElement);
  fsIcon.setAttribute('href',on?'#i-compress':'#i-expand');
  const lbl=on?'Выйти из полного экрана':'Полный экран';
  fsBtn.title=lbl+' (F)';fsBtn.setAttribute('aria-label',lbl);
}
fsBtn.addEventListener('click',toggleFS);
document.addEventListener('fullscreenchange',syncFS);
document.addEventListener('webkitfullscreenchange',syncFS);

/* Скачивание UHD: fetch → blob; при CORS — режим «Открыть UHD» */
dlBtn.addEventListener('click',e=>{
  if(dl.cors)return; /* нативный переход в новой вкладке */
  e.preventDefault();
  if(!dl.busy)startDownload();
});
function startDownload(){
  const e=entries[cur],token=navToken;
  dl.busy=true;setDlState('loading');
  const ctrl=new AbortController();dl.ctrl=ctrl;
  fetch(e.url,{signal:ctrl.signal,mode:'cors',credentials:'omit'})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.blob()})
    .then(blob=>{
      if(ctrl.signal.aborted||token!==navToken)return;
      const u=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=u;a.download=e.img_id+'_UHD.jpg';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),5000);
      if(token===navToken){
        setDlState('success');
        setTimeout(()=>{if(token===navToken&&!dl.busy)setDlState(dl.cors?'open':'idle')},1600);
      }
    })
    .catch(()=>{
      if(ctrl.signal.aborted||token!==navToken)return;
      dl.cors=true;setDlState('open');
      window.open(e.url,'_blank','noopener');
    })
    .finally(()=>{if(dl.ctrl===ctrl)dl.ctrl=null;dl.busy=false});
}

/* Наверх */
let ticking=false;
addEventListener('scroll',()=>{
  if(ticking)return;ticking=true;
  requestAnimationFrame(()=>{toTop.classList.toggle('show',scrollY>900);ticking=false});
},{passive:true});
toTop.addEventListener('click',()=>scrollTo({top:0,behavior:RM?'auto':'smooth'}));

boot();
})();
</script>
</body>
</html>
