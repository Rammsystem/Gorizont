<html lang="ru" data-theme="dark" data-density="comfortable">

<title>Горизонт — архив обоев Bing</title>
<meta name="description" content="Минималистичный архив ежедневных фоновых изображений Bing в разрешении 4K UHD.">
<meta name="color-scheme" content="dark light">
<meta id="metaTheme" name="theme-color" content="#0c0f14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230c0f14'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%233b5bdb'/%3E%3Cstop offset='.5' stop-color='%23e8663d'/%3E%3Cstop offset='1' stop-color='%23f7d9a0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='26' r='6.5' fill='%23f0a63c'/%3E%3Crect x='9' y='37' width='46' height='3' rx='1.5' fill='url(%23g)'/%3E%3C/svg%3E">
<script>
(function(){var t,d;try{t=localStorage.getItem('gorizont:theme');d=localStorage.getItem('gorizont:density')}catch(e){}
var h=document.documentElement;h.dataset.theme=(t==='light')?'light':'dark';h.dataset.density=(d==='compact')?'compact':'comfortable';})();
</script>
<style>
/* ============ ТОКЕНЫ ============ */
:root{
  --topH:56px; --topGap:10px;
  --gap:8px; --r:10px; --cell:372px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --spring:cubic-bezier(.34,1.4,.64,1);
  --horizon:linear-gradient(90deg,#3b5bdb,#7b5bd6,#e8663d,#f0a63c,#f7d9a0);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c0f14; --bg2:#11151c; --surface:#171c25; --skHi:#1d232e;
  --text:#e9edf3; --muted:#98a2b3; --faint:#616c7d;
  --line:rgba(233,237,243,.10); --line2:rgba(233,237,243,.22);
  --glass:rgba(14,18,25,.62); --hi:rgba(255,255,255,.07);
  --accent:#f0a63c; --accentInk:#1a1206; --ember:#e8663d; --dusk:#7b5bd6;
  --ok:#5fd39a; --okInk:#08210f; --warn:#f2c14e; --danger:#f0705a; --info:#63b3ed;
  --glow:radial-gradient(1100px 380px at 50% -180px,rgba(240,166,60,.09),transparent 70%);
  --shadow:0 24px 60px rgba(0,0,0,.45);
  --imgShadow:0 40px 120px rgba(0,0,0,.7);
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f2ed; --bg2:#faf9f6; --surface:#ffffff; --skHi:#e9e6df;
  --text:#171a1f; --muted:#5c6470; --faint:#8b929c;
  --line:rgba(23,26,31,.12); --line2:rgba(23,26,31,.26);
  --glass:rgba(255,255,255,.68); --hi:rgba(255,255,255,.9);
  --accent:#b3720c; --accentInk:#fff8ec; --ember:#c9481f; --dusk:#5b3fbd;
  --ok:#1f8a55; --okInk:#f0fff6; --warn:#9a6b00; --danger:#c33f28; --info:#1f6fa8;
  --glow:radial-gradient(1100px 380px at 50% -180px,rgba(179,114,12,.08),transparent 70%);
  --shadow:0 24px 60px rgba(40,34,22,.16);
  --imgShadow:0 40px 120px rgba(0,0,0,.55);
}
@supports (color:oklch(.5 .1 200)){
  html[data-theme="dark"]{
    --bg:oklch(.17 .012 258); --bg2:oklch(.21 .014 258); --surface:oklch(.25 .016 258); --skHi:oklch(.29 .018 258);
    --text:oklch(.95 .006 250); --muted:oklch(.72 .022 255); --faint:oklch(.55 .022 255);
    --line:oklch(1 0 0/.10); --line2:oklch(1 0 0/.22); --glass:oklch(.19 .014 258/.62);
    --accent:oklch(.80 .15 76); --ember:oklch(.68 .18 38); --dusk:oklch(.60 .17 300);
    --ok:oklch(.82 .16 158); --warn:oklch(.85 .15 90); --danger:oklch(.70 .19 27); --info:oklch(.76 .13 235);
    --glow:radial-gradient(1100px 380px at 50% -180px,oklch(.80 .15 76/.10),transparent 70%);
  }
  html[data-theme="light"]{
    --bg:oklch(.96 .007 85); --bg2:oklch(.985 .005 85); --surface:oklch(1 0 0); --skHi:oklch(.93 .008 85);
    --text:oklch(.22 .012 260); --muted:oklch(.50 .02 260); --faint:oklch(.66 .018 260);
    --line:oklch(.22 .012 260/.12); --line2:oklch(.22 .012 260/.26); --glass:oklch(1 0 0/.68);
    --accent:oklch(.60 .15 66); --ember:oklch(.56 .19 35); --dusk:oklch(.48 .19 295);
    --ok:oklch(.55 .14 158); --warn:oklch(.56 .13 80); --danger:oklch(.55 .19 28); --info:oklch(.53 .13 240);
    --glow:radial-gradient(1100px 380px at 50% -180px,oklch(.60 .15 66/.09),transparent 70%);
  }
  :root{--horizon:linear-gradient(90deg,oklch(.50 .19 265),oklch(.58 .19 300),oklch(.68 .18 38),oklch(.82 .15 76),oklch(.93 .09 95))}
}
@media (color-gamut:p3){
  html[data-theme="dark"]{--accent:color(display-p3 .96 .68 .28);--ember:color(display-p3 .91 .42 .24);--ok:color(display-p3 .38 .85 .62)}
}
@supports (transition-timing-function:linear(0,1)){
  :root{--spring:linear(0,.006,.025 2.8%,.101 6.1%,.539 18.9%,.721 25.3%,.849 31.5%,.937 38.1%,.968 41.8%,.991 45.7%,1.006 50.1%,1.015 55%,1.017 63.9%,1.001 100%)}
}
html[data-density="compact"]{--cell:252px;--r:8px}

/* ============ БАЗА ============ */
*,*::before,*::after{box-sizing:border-box}
html{scrollbar-gutter:stable;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);min-height:100dvh;
  font:400 14px/1.5 system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-optical-sizing:auto;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;background:var(--glow);pointer-events:none;z-index:0}
body.locked{overflow:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
::selection{background:color-mix(in oklab,var(--accent) 35%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.icon{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* ============ ШАПКА ============ */
.top{
  position:fixed;z-index:50;left:var(--topGap);right:var(--topGap);
  top:calc(var(--topGap) + env(safe-area-inset-top));height:var(--topH);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 8px 0 16px;
  border:1px solid var(--line);border-radius:18px;background:var(--glass);
  backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
  box-shadow:var(--shadow),inset 0 1px 0 var(--hi);
  animation:topIn .6s var(--ease) both;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:22px;height:22px;flex:none;overflow:visible}
.wordmark{font-size:11.5px;font-weight:650;letter-spacing:.4em;text-transform:uppercase;white-space:nowrap}
.bar{display:flex;align-items:center;gap:6px}
.count{font-size:12px;color:var(--muted);white-space:nowrap;padding-right:6px}
.sep{width:1px;height:20px;background:var(--line);flex:none}
.seg{position:relative;display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:12px}
.seg::before{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:9px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line2),0 2px 8px rgba(0,0,0,.18);transform:translateX(calc(var(--i,0) * 30px));transition:transform .45s var(--spring)}
.seg button{position:relative;z-index:1;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:color .2s}
.seg button.on{color:var(--text)}
.seg button:hover{color:var(--text)}
.tbtn{width:34px;height:34px;border:1px solid var(--line);border-radius:11px;display:grid;place-items:center;color:var(--text);transition:border-color .2s,background .2s,transform .35s var(--spring)}
.tbtn:hover{border-color:var(--line2);background:var(--surface)}
.tbtn:active{transform:scale(.9)}
.tbtn .icon{transition:transform .5s var(--spring)}
html[data-theme="light"] .tbtn .icon{transform:rotate(-35deg)}
.progress{position:absolute;left:14px;right:14px;bottom:5px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;border-radius:2px;background:var(--horizon);background-size:100% 100%;transform:scaleX(0);transform-origin:left}
html[data-theme="dark"] .progress i{box-shadow:0 0 10px color-mix(in oklab,var(--accent) 55%,transparent)}

/* ============ КОНТЕНТ ============ */
main{position:relative;z-index:1;padding:calc(var(--topH) + var(--topGap) + 26px + env(safe-area-inset-top)) 14px 30px}
.caption{margin:0 2px 14px;font-size:12.5px;color:var(--muted);letter-spacing:.015em;text-wrap:balance;animation:fadeUp .7s var(--ease) .12s both}
.caption b{font-weight:600;color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--cell)),1fr));gap:var(--gap);grid-auto-flow:row dense}
.cell{
  position:relative;display:block;width:100%;aspect-ratio:16/9;overflow:hidden;isolation:isolate;
  border-radius:var(--r);background:var(--bg2);border:1px solid var(--line);cursor:zoom-in;
  opacity:0;transform:translateY(16px);
  transition:opacity .6s var(--ease) var(--d,0ms),transform .6s var(--ease) var(--d,0ms),border-color .25s,box-shadow .35s,filter .3s;
}
.cell.in{opacity:1;transform:none}
.cell img{width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.03);transition:opacity .7s var(--ease),transform 1.1s var(--ease)}
.cell.loaded img{opacity:1;transform:none}
.cell::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .35s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.14),transparent 62%)}
@media (hover:hover){
  .cell:hover{border-color:var(--line2);box-shadow:0 14px 34px rgba(0,0,0,.32)}
  .cell:hover img{transform:scale(1.05)}
  .cell:hover::after{opacity:1}
  .grid:has(.cell:hover) .cell:not(:hover){filter:opacity(.6) saturate(.85)}
}
.cell:focus-visible{outline-offset:3px}
.cell.peek{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cell:has(img.broken){cursor:default}
.cell:has(img.broken) img{display:none}
.cell:has(img.broken)::before{content:"недоступно";position:absolute;inset:0;display:grid;place-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
@media (min-width:900px){.cell.lead{grid-column:span 2;grid-row:span 2;aspect-ratio:auto;--r:14px;border-radius:14px}}
.skel{cursor:default;opacity:1;transform:none;background:linear-gradient(100deg,var(--bg2) 40%,var(--skHi) 50%,var(--bg2) 60%);background-size:200% 100%;animation:shimmer 1.5s linear infinite}
.sentinel{display:grid;place-items:center;padding:32px 0}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);animation:rot .7s linear infinite}
.endcap{text-align:center;padding:36px 0 4px}
.endcap i{display:block;width:72px;height:2px;margin:0 auto;border-radius:2px;background:var(--horizon);opacity:.9}
.endcap p{margin:13px 0 0;font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--faint)}
.error{max-width:430px;margin:64px auto;text-align:center;padding:34px 28px;border:1px solid var(--line);border-radius:20px;background:var(--bg2);box-shadow:var(--shadow)}
.error h2{margin:0 0 8px;font-size:15px;font-weight:650;color:var(--danger)}
.error p{margin:0 0 18px;font-size:13px;color:var(--muted);text-wrap:pretty}
.error code{display:block;margin:0 0 18px;padding:11px;border-radius:10px;background:var(--bg);font-size:12px;color:var(--info)}
.btn-solid{display:inline-flex;align-items:center;height:40px;padding:0 22px;border-radius:99px;background:var(--text);color:var(--bg);font-size:13px;font-weight:650;transition:background .2s,color .2s,transform .35s var(--spring)}
.btn-solid:hover{background:var(--accent);color:var(--accentInk)}
.btn-solid:active{transform:scale(.95)}
footer{position:relative;z-index:1;padding:22px 20px calc(52px + env(safe-area-inset-bottom));text-align:center;font-size:11.5px;color:var(--faint)}
footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line2);transition:color .2s,border-color .2s}
footer a:hover{color:var(--accent);border-color:var(--accent)}
.totop{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;color:var(--muted);background:var(--glass);border:1px solid var(--line2);
  backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transform:translateY(10px) scale(.9);transition:opacity .3s,transform .45s var(--spring),color .2s,border-color .2s}
.totop.show{opacity:1;pointer-events:auto;transform:none}
.totop:hover{color:var(--accent);border-color:var(--accent)}

/* ============ ЛАЙТБОКС ============ */
dialog#lb{
  position:fixed;inset:0;width:100%;height:100dvh;max-width:100%;max-height:100dvh;margin:0;padding:0;border:0;overflow:hidden;
  background:oklch(.13 .012 258/.86);color:#eef1f5;overscroll-behavior:contain;
  backdrop-filter:blur(20px) saturate(1.1);-webkit-backdrop-filter:blur(20px) saturate(1.1);
  opacity:0;transition:opacity .3s var(--ease),display .3s allow-discrete,overlay .3s allow-discrete;
}
dialog#lb[open]{opacity:1}
@starting-style{dialog#lb[open]{opacity:0}}
dialog#lb::backdrop{background:transparent}
dialog#lb:focus{outline:none}
.amb{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.35);
  filter:blur(64px) saturate(1.8) brightness(.55);opacity:0;transition:opacity .6s var(--ease);pointer-events:none}
.amb.on{opacity:.62}
.veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 50%,transparent 30%,rgba(6,8,12,.72) 100%)}
.lb-top{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(14px + env(safe-area-inset-top)) 14px 14px;background:linear-gradient(180deg,rgba(6,8,12,.7),transparent)}
.lb-meta{display:flex;align-items:baseline;min-width:0}
#lbDate{font-size:12.5px;color:#dbe0e7;white-space:nowrap}
.lb-count{margin-left:12px;font-size:12px;color:#98a2b3;white-space:nowrap}
.lb-actions{display:flex;gap:8px;flex:none}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#e9edf3;
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:background .2s,border-color .2s,transform .4s var(--spring),opacity .25s}
.ic:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.36)}
.ic:active{transform:scale(.9)}
.ic[hidden]{display:none}
.stage{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:70px 86px 112px;touch-action:none}
.lb-loader{position:absolute;inset:0;display:none;place-items:center;z-index:0}
.stage.loading .lb-loader{display:grid}
.spin-lg{width:28px;height:28px;border-color:rgba(255,255,255,.22);border-top-color:var(--accent)}
#lbImg{position:relative;z-index:1;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:6px;
  box-shadow:var(--imgShadow);cursor:zoom-in;user-select:none;-webkit-user-drag:none;will-change:transform;
  transition:opacity .25s var(--ease)}
#lbImg.fade{opacity:0}
#lbImg.smooth{transition:opacity .25s var(--ease),transform .42s var(--spring)}
.stage.zoomed #lbImg{cursor:grab}
.stage.zoomed.drag #lbImg{cursor:grabbing}
.lb-nav{position:absolute;top:50%;z-index:4;width:46px;height:46px;transform:translateY(-50%)}
.lb-nav.prev{left:16px}.lb-nav.next{right:16px}
.lb-nav:active{transform:translateY(-50%) scale(.9)}
.lb-bottom{position:absolute;left:0;right:0;bottom:0;z-index:4;container-type:inline-size;
  display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(6,8,12,.78),transparent)}
.dl{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 24px;border-radius:99px;
  background:#eef1f5;color:#0f1319;font-size:13.5px;font-weight:650;text-decoration:none;border:1px solid transparent;
  box-shadow:0 10px 30px rgba(0,0,0,.4);transition:background .2s,color .2s,border-color .2s,transform .4s var(--spring)}
.dl>*{position:relative;z-index:1}
.dl::before{content:"";position:absolute;inset:0;z-index:0;background:var(--accent);transform:scaleX(var(--p,0));transform-origin:left;transition:transform .2s linear;opacity:0}
.dl:hover{background:var(--accent);color:var(--accentInk)}
.dl:active{transform:scale(.96)}
.dl .spin{width:14px;height:14px;border-color:rgba(15,19,25,.25);border-top-color:currentColor;display:none}
.dl[data-state="loading"]{pointer-events:none}
.dl[data-state="loading"]::before{opacity:.55}
.dl[data-state="loading"] .dl-svg{display:none}
.dl[data-state="loading"] .spin{display:block}
.dl[data-state="success"]{background:var(--ok);color:var(--okInk)}
.dl[data-state="open"]{background:transparent;border-color:rgba(255,255,255,.34);color:#eef1f5;box-shadow:none}
.dl[data-state="open"]:hover{border-color:var(--accent);color:var(--accent)}
.lb-status{min-height:15px;font-size:11.5px;color:#98a2b3;letter-spacing:.02em}
.lb-status.pulse{animation:pulse 1.5s ease-in-out infinite}
.hints{position:absolute;left:16px;bottom:calc(15px + env(safe-area-inset-bottom));z-index:4;display:flex;gap:6px;align-items:center;font-size:10.5px;color:#7d8592}
kbd{font:inherit;font-size:10px;line-height:1;padding:3px 5px;border-radius:5px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);box-shadow:0 1px 0 rgba(255,255,255,.08) inset}
@container (max-width:430px){.dl{height:42px;padding:0 20px;font-size:13px}}

/* ============ VIEW TRANSITIONS ============ */
::view-transition-group(wall){animation-duration:.52s;animation-timing-function:var(--spring);z-index:10}
::view-transition-old(wall),::view-transition-new(wall){animation:none;mix-blend-mode:normal;width:100%;height:100%;object-fit:cover}
::view-transition-group(root){animation-duration:.42s;animation-timing-function:var(--ease)}
html.vt dialog#lb{transition:none!important}
html.vt dialog#lb[open]{opacity:1!important}
html.vt .cell{opacity:1!important;transform:none!important;filter:none!important}
html.vt .cell img{transform:none!important}
html.vt .cell::after{opacity:0!important}
html.tv::view-transition-image-pair(root){isolation:auto}
html.tv::view-transition-old(root),html.tv::view-transition-new(root){animation:none;mix-blend-mode:normal;display:block}
html.tv::view-transition-old(root){z-index:0}
html.tv::view-transition-new(root){z-index:1;animation:circle .6s var(--ease) both}
@keyframes circle{from{clip-path:circle(0 at var(--vx,50%) var(--vy,0))}to{clip-path:circle(var(--vr,150vmax) at var(--vx,50%) var(--vy,0))}}

/* ============ SCROLL-DRIVEN ============ */
@supports (animation-timeline:view()){
  .cell{opacity:1;transform:none;animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 58%;
    transition:border-color .25s,box-shadow .35s,filter .3s}
  .progress i{animation:grow linear both;animation-timeline:scroll(root block)}
  .top{animation:topIn .6s var(--ease) both,condense linear both;animation-timeline:auto,scroll(root block);animation-range:normal,0 200px}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes condense{to{height:46px;border-radius:15px;box-shadow:0 10px 26px rgba(0,0,0,.3),inset 0 1px 0 var(--hi)}}
  @keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
}

/* ============ АНИМАЦИИ ============ */
@keyframes topIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ============ АДАПТИВ ============ */
@media (max-width:760px){
  :root{--gap:6px;--topGap:8px}
  main{padding-left:9px;padding-right:9px}
  .caption{font-size:11.5px;margin-bottom:11px}
  .lb-nav,.hints{display:none}
  .stage{padding:62px 8px 124px}
  .lb-top{padding:calc(10px + env(safe-area-inset-top)) 10px 10px}
  .ic{width:38px;height:38px}
}
@media (max-width:560px){.count{display:none}.wordmark{letter-spacing:.28em;font-size:11px}.top{padding-left:13px}}
@media (max-height:520px){
  .stage{padding:50px 70px 94px}.hints{display:none}
  .lb-top{padding-top:8px;padding-bottom:8px}.lb-bottom{padding-top:8px;padding-bottom:10px}.dl{height:38px}
}
@media (prefers-reduced-transparency:reduce){
  .top,.totop{background:var(--bg2);backdrop-filter:none;-webkit-backdrop-filter:none}
  dialog#lb{background:#0b0e13;backdrop-filter:none;-webkit-backdrop-filter:none}
  .amb{display:none}.ic{background:rgba(255,255,255,.1);backdrop-filter:none}
}
@media (prefers-contrast:more){:root{--line:var(--line2)}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .cell{animation:none!important;opacity:1!important;transform:none!important}
  .top{animation:none!important}
}
</style>

<noscript><div class="error" style="position:fixed;left:16px;right:16px;top:38%;z-index:99"><h2>Нужен JavaScript</h2><p>Для работы архива необходим JavaScript.</p></div></noscript>

<script>
(function(){'use strict';
/* ---------- утилиты ---------- */
var $=function(s){return document.querySelector(s)};
var html=document.documentElement;
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
var SDA=window.CSS&&CSS.supports&&CSS.supports('animation-timeline','view()');
var VT=typeof document.startViewTransition==='function'&&!RM;
var clamp=function(v,a,b){return v<a?a:v>b?b:v};
var mod=function(i,n){return ((i%n)+n)%n};

var grid=$('#grid'),sentinel=$('#sentinel'),endcap=$('#endcap'),errorBox=$('#error'),errMsg=$('#errMsg'),errHint=$('#errHint'),countEl=$('#count'),prog=$('#prog');
var dialog=$('#lb'),stage=$('#stage'),lbImg=$('#lbImg'),lbDate=$('#lbDate'),lbCount=$('#lbCount'),lbStatus=$('#lbStatus');
var dlBtn=$('#dlBtn'),dlIcon=$('#dlIcon'),dlLabel=$('#dlLabel'),fsBtn=$('#fsBtn'),fsIcon=$('#fsIcon'),zoomReset=$('#zoomReset');
var toTop=$('#toTop'),themeBtn=$('#themeBtn'),themeIcon=$('#themeIcon'),seg=$('#seg');
var segBtns=[].slice.call(seg.querySelectorAll('button'));
var ambs=[$('#ambA'),$('#ambB')],ambSide=0;

var BATCH=48,entries=[],total=0,rendered=0,cur=0,openedIdx=0,navToken=0,closing=false,lastFocus=null,vtBusy=false;
var revealIO=null,sentIO=null,baseDims='',statusBase='',statusPulse=false;
var dl={busy:false,cors:false,ctrl:null};
var z={s:1,x:0,y:0},smoothT=0;
var dateCache=new Map();
var fmt=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'});

function human(e){
  if(dateCache.has(e.img_id))return dateCache.get(e.img_id);
  var m=/^(\d{4})(\d{2})(\d{2})/.exec(e.sort_key||'');
  var s=m?fmt.format(new Date(+m[1],+m[2]-1,+m[3])).replace(' г.',''):'Без даты';
  dateCache.set(e.img_id,s);return s;
}
function plural(n,f){var a=n%10,b=n%100;return a===1&&b!==11?f[0]:a>=2&&a<=4&&(b<12||b>14)?f[1]:f[2]}

/* ---------- переходы представления ---------- */
function clearNames(){lbImg.style.viewTransitionName='';var a=grid.querySelectorAll('[style*="view-transition-name"]');for(var i=0;i<a.length;i++)a[i].style.viewTransitionName=''}
function vt(update,after){
  if(!VT||vtBusy){update();if(after)after();return}
  vtBusy=true;var t;
  try{t=document.startViewTransition(function(){html.classList.add('vt');update()})}
  catch(e){html.classList.remove('vt');vtBusy=false;update();if(after)after();return}
  var done=function(){html.classList.remove('vt');vtBusy=false;clearNames();if(after)after()};
  t.finished.then(done,done);
}

/* ---------- тема / плотность ---------- */
function applyTheme(t){
  html.dataset.theme=t;
  $('#metaTheme').content=t==='light'?'#f4f2ed':'#0c0f14';
  themeIcon.setAttribute('href',t==='light'?'#i-moon':'#i-sun');
  var l=t==='light'?'Тёмная тема':'Светлая тема';
  themeBtn.title=l;themeBtn.setAttribute('aria-label',l);
  try{localStorage.setItem('gorizont:theme',t)}catch(e){}
}
themeBtn.addEventListener('click',function(){
  var next=html.dataset.theme==='light'?'dark':'light';
  if(!VT||vtBusy){applyTheme(next);return}
  var r=themeBtn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  html.style.setProperty('--vx',cx+'px');html.style.setProperty('--vy',cy+'px');
  html.style.setProperty('--vr',Math.hypot(Math.max(cx,innerWidth-cx),Math.max(cy,innerHeight-cy))+'px');
  html.classList.add('tv');vtBusy=true;
  var t;
  try{t=document.startViewTransition(function(){applyTheme(next)})}
  catch(e){html.classList.remove('tv');vtBusy=false;applyTheme(next);return}
  var done=function(){html.classList.remove('tv');vtBusy=false};
  t.finished.then(done,done);
});
function applyDensity(d){
  html.dataset.density=d;
  seg.style.setProperty('--i',d==='compact'?1:0);
  segBtns.forEach(function(b){var on=b.dataset.density===d;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  try{localStorage.setItem('gorizont:density',d)}catch(e){}
}
segBtns.forEach(function(b){b.addEventListener('click',function(){applyDensity(b.dataset.density)})});
applyTheme(html.dataset.theme||'dark');
applyDensity(html.dataset.density||'comfortable');

/* ---------- загрузка данных ---------- */
function showSkeleton(){
  grid.hidden=false;errorBox.hidden=true;sentinel.hidden=false;endcap.hidden=true;grid.innerHTML='';
  var f=document.createDocumentFragment();
  for(var i=0;i<12;i++){var d=document.createElement('div');d.className='cell skel';if(i===0)d.classList.add('lead');f.appendChild(d)}
  grid.appendChild(f);
}
function initObservers(){
  if(!SDA){
    if(!revealIO)revealIO=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');revealIO.unobserve(en.target)}})},{threshold:.05,rootMargin:'0px 0px -20px 0px'});
    else revealIO.disconnect();
  }
  if(!sentIO)sentIO=new IntersectionObserver(function(es){if(es[0].isIntersecting&&rendered<total)renderMore()},{rootMargin:'1500px 0px'});
  sentIO.observe(sentinel);
}
function renderMore(){
  if(rendered>=total)return;
  var start=rendered,end=Math.min(total,rendered+BATCH),f=document.createDocumentFragment(),cells=[];
  for(var i=start;i<end;i++){
    var e=entries[i],b=document.createElement('button');
    b.type='button';b.className='cell'+(i===0?' lead':'');b.dataset.idx=i;
    b.style.setProperty('--d',Math.min((i-start)*32,300)+'ms');
    b.setAttribute('aria-label','Открыть обои: '+human(e));
    var im=document.createElement('img');
    im.loading='lazy';im.decoding='async';im.alt='';im.draggable=false;im.src=e.preview;
    im.addEventListener('load',function(ev){ev.currentTarget.parentNode.classList.add('loaded')},{once:true});
    im.addEventListener('error',function(ev){var p=ev.currentTarget.parentNode;p.classList.add('loaded');ev.currentTarget.classList.add('broken');p.disabled=true},{once:true});
    if(im.complete&&im.naturalWidth)b.classList.add('loaded');
    b.appendChild(im);f.appendChild(b);cells.push(b);
  }
  grid.appendChild(f);
  if(revealIO)cells.forEach(function(c){revealIO.observe(c)});else cells.forEach(function(c){c.classList.add('in')});
  rendered=end;
  if(rendered>=total){sentinel.hidden=true;endcap.hidden=false;if(sentIO)sentIO.unobserve(sentinel)}
}
function ensureRendered(n){while(rendered<n&&rendered<total)renderMore()}
function boot(){
  showSkeleton();countEl.textContent='…';
  fetch('data.json',{cache:'no-cache'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
  }).then(function(data){
    entries=Object.keys(data).map(function(k){return data[k]}).filter(function(e){return e&&e.url&&e.preview})
      .sort(function(a,b){return String(b.sort_key||'').localeCompare(String(a.sort_key||''))});
    if(!entries.length)throw new Error('архив пуст');
    total=entries.length;rendered=0;dateCache.clear();grid.innerHTML='';
    countEl.textContent=total+' '+plural(total,['изображение','изображения','изображений']);
    initObservers();renderMore();handleHash();
  }).catch(function(err){
    grid.hidden=true;sentinel.hidden=true;endcap.hidden=true;errorBox.hidden=false;
    errMsg.textContent='Проверьте соединение и попробуйте ещё раз.'+(err&&err.message?' ('+err.message+')':'');
    errHint.hidden=location.protocol!=='file:';
    if(location.protocol==='file:')errMsg.textContent='Откройте сайт через локальный сервер:';
    countEl.textContent='—';
  });
}
$('#retryBtn').addEventListener('click',boot);
grid.addEventListener('click',function(e){
  var c=e.target.closest('.cell');
  if(!c||c.disabled||c.classList.contains('skel'))return;
  openLB(+c.dataset.idx);
});

/* ---------- блик под курсором ---------- */
if(matchMedia('(hover:hover)').matches&&!RM){
  var sheenCell=null,sheenQ=false,sx=0,sy=0;
  grid.addEventListener('pointermove',function(e){
    var c=e.target.closest('.cell');if(!c||c.classList.contains('skel'))return;
    sheenCell=c;sx=e.clientX;sy=e.clientY;
    if(sheenQ)return;sheenQ=true;
    requestAnimationFrame(function(){
      sheenQ=false;if(!sheenCell)return;
      var r=sheenCell.getBoundingClientRect();
      sheenCell.style.setProperty('--mx',(sx-r.left)+'px');
      sheenCell.style.setProperty('--my',(sy-r.top)+'px');
    });
  },{passive:true});
  grid.addEventListener('pointerleave',function(){sheenCell=null},{passive:true});
}

/* ---------- прогресс / наверх ---------- */
var tick=false;
function onScroll(){
  if(tick)return;tick=true;
  requestAnimationFrame(function(){
    tick=false;
    var h=document.documentElement.scrollHeight-innerHeight;
    if(!SDA||RM)prog.style.transform='scaleX('+(h>0?clamp(scrollY/h,0,1):0)+')';
    toTop.classList.toggle('show',scrollY>900);
  });
}
addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',onScroll,{passive:true});
toTop.addEventListener('click',function(){scrollTo({top:0,behavior:RM?'auto':'smooth'})});

/* ---------- хэш ---------- */
function setHash(e){try{history.replaceState(null,'','#'+encodeURIComponent(e.img_id))}catch(_){}}
function clearHash(){try{history.replaceState(null,'',location.pathname+location.search)}catch(_){}}
function handleHash(){
  var h=location.hash.slice(1);if(!h)return;
  var id;try{id=decodeURIComponent(h)}catch(_){id=h}
  for(var i=0;i<entries.length;i++)if(entries[i].img_id===id){ensureRendered(i+1);openLB(i);return}
}

/* ---------- ambient ---------- */
function setAmbient(url){
  if(!url){ambs.forEach(function(a){a.classList.remove('on')});return}
  var next=ambs[ambSide^1],old=ambs[ambSide];
  next.style.backgroundImage='url("'+url+'")';
  next.classList.add('on');old.classList.remove('on');ambSide^=1;
}

/* ---------- статус / кнопка ---------- */
function renderStatus(){
  lbStatus.textContent=statusBase+(z.s>1.02?' · ×'+z.s.toFixed(1):'');
  lbStatus.classList.toggle('pulse',statusPulse);
}
function setStatus(t,pulse){statusBase=t||'';statusPulse=!!pulse;renderStatus()}
function setDlState(s,pct){
  dlBtn.dataset.state=s;
  var m={idle:['#i-dl','Скачать UHD','Скачать в 4K'],loading:['#i-dl','Скачивание',''],
         success:['#i-ok','Сохранено',''],open:['#i-ext','Открыть UHD','Откроется в новой вкладке']}[s];
  dlIcon.setAttribute('href',m[0]);
  dlLabel.textContent=s==='loading'&&pct!=null?'Скачивание '+pct+'%':m[1];
  dlBtn.title=m[2];dlBtn.setAttribute('aria-label',dlLabel.textContent);
  dlBtn.style.setProperty('--p',s==='loading'?(pct||0)/100:0);
}
function abortDL(){if(dl.ctrl){dl.ctrl.abort();dl.ctrl=null}}

/* ---------- масштаб ---------- */
function applyZ(){
  lbImg.style.transform='translate3d('+z.x+'px,'+z.y+'px,0) scale('+z.s+')';
  var zoomed=z.s>1.02;
  stage.classList.toggle('zoomed',zoomed);
  zoomReset.hidden=!zoomed;
  renderStatus();
}
function clampPan(){
  var bw=lbImg.offsetWidth||0,bh=lbImg.offsetHeight||0;
  var mx=Math.max(0,bw*(z.s-1)/2),my=Math.max(0,bh*(z.s-1)/2);
  z.x=clamp(z.x,-mx,mx);z.y=clamp(z.y,-my,my);
}
function resetZoom(){z.s=1;z.x=0;z.y=0;stage.classList.remove('drag');applyZ()}
function smooth(){lbImg.classList.add('smooth');clearTimeout(smoothT);smoothT=setTimeout(function(){lbImg.classList.remove('smooth')},450)}
function setZoom(ns,ax,ay){
  ns=clamp(ns,1,6);
  var r=lbImg.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,k=ns/z.s;
  if(ax!=null){z.x+=(ax-cx)*(1-k);z.y+=(ay-cy)*(1-k)}
  z.s=ns;if(z.s<=1.001){z.s=1;z.x=0;z.y=0}
  clampPan();applyZ();
}
stage.addEventListener('wheel',function(e){
  if(!dialog.open)return;
  e.preventDefault();
  var d=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?innerHeight:1);
  setZoom(z.s*Math.exp(-d*.0016),e.clientX,e.clientY);
},{passive:false});
lbImg.addEventListener('dblclick',function(e){
  smooth();
  if(z.s>1.02)resetZoom();else setZoom(2.6,e.clientX,e.clientY);
});
zoomReset.addEventListener('click',function(){smooth();resetZoom()});

/* ---------- жесты ---------- */
var pts=new Map(),gest=null,suppress=false;
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
stage.addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse'&&e.button!==0)return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
  suppress=false;
  if(pts.size===2){var v=[].concat.apply([],[Array.from(pts.values())]);gest={t:'pinch',d:dist(v[0],v[1]),s:z.s}}
  else if(pts.size===1){gest={t:z.s>1.02?'pan':'swipe',x:e.clientX,y:e.clientY,ox:z.x,oy:z.y};if(z.s>1.02)stage.classList.add('drag')}
});
stage.addEventListener('pointermove',function(e){
  if(!pts.has(e.pointerId)||!gest)return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gest.t==='pinch'&&pts.size>=2){
    var v=Array.from(pts.values()),d=dist(v[0],v[1]);
    if(gest.d>0)setZoom(gest.s*(d/gest.d),(v[0].x+v[1].x)/2,(v[0].y+v[1].y)/2);
    suppress=true;
  }else if(gest.t==='pan'){
    z.x=gest.ox+(e.clientX-gest.x);z.y=gest.oy+(e.clientY-gest.y);
    clampPan();applyZ();suppress=true;
  }else if(gest.t==='swipe'){
    if(Math.abs(e.clientX-gest.x)>10||Math.abs(e.clientY-gest.y)>10)suppress=true;
  }
});
function endPtr(e){
  if(!pts.has(e.pointerId))return;
  pts.delete(e.pointerId);
  if(gest&&gest.t==='swipe'&&pts.size===0){
    var dx=e.clientX-gest.x,dy=e.clientY-gest.y;
    if(Math.abs(dx)>56&&Math.abs(dx)>Math.abs(dy)*1.2)navTo(cur+(dx<0?1:-1));
  }
  if(pts.size===0){gest=null;stage.classList.remove('drag')}
  else{var p=Array.from(pts.values())[0];gest={t:z.s>1.02?'pan':'swipe',x:p.x,y:p.y,ox:z.x,oy:z.y};suppress=true}
}
stage.addEventListener('pointerup',endPtr);
stage.addEventListener('pointercancel',endPtr);
stage.addEventListener('click',function(e){if(e.target===stage&&!suppress)closeLB()});

/* ---------- содержимое лайтбокса ---------- */
function loadUHD(e,token,dims){
  var u=new Image();u.decoding='async';
  u.onload=function(){if(token!==navToken)return;lbImg.src=e.url;baseDims=u.naturalWidth+' × '+u.naturalHeight+' · UHD';setStatus(baseDims,false)};
  u.onerror=function(){if(token!==navToken)return;baseDims=dims+' · превью';setStatus(baseDims,false)};
  u.src=e.url;
}
function navTo(i,instant){
  cur=mod(i,total);navToken++;
  var token=navToken,e=entries[cur];
  abortDL();dl.busy=false;setDlState(dl.cors?'open':'idle');
  resetZoom();
  lbDate.textContent=human(e);
  lbCount.textContent=(cur+1)+' / '+total;
  dlBtn.href=e.url;dlBtn.setAttribute('download',e.img_id+'_UHD.jpg');
  lbImg.alt='Обои Bing — '+human(e);
  setAmbient(e.preview);
  setStatus('',false);
  if(instant){lbImg.src=e.preview;lbImg.classList.remove('fade');stage.classList.remove('loading')}
  else{lbImg.classList.add('fade');stage.classList.add('loading')}
  var pre=new Image();pre.decoding='async';
  pre.onload=function(){
    if(token!==navToken)return;
    var dims=pre.naturalWidth+' × '+pre.naturalHeight;
    if(!instant){
      lbImg.src=e.preview;
      requestAnimationFrame(function(){if(token!==navToken)return;lbImg.classList.remove('fade');stage.classList.remove('loading')});
    }
    baseDims=dims+' · загрузка 4K…';setStatus(baseDims,true);
    loadUHD(e,token,dims);
  };
  pre.onerror=function(){if(token!==navToken)return;stage.classList.remove('loading');lbImg.classList.add('fade');setStatus('Не удалось загрузить изображение',false)};
  pre.src=e.preview;
  [cur-1,cur+1].forEach(function(k){var n=entries[mod(k,total)];if(n){var p=new Image();p.src=n.preview}});
  setHash(e);
}
function openDialog(){
  if(typeof dialog.showModal==='function'){if(!dialog.open)dialog.showModal()}
  else dialog.setAttribute('open','');
  document.body.classList.add('locked');
  syncFS();
  dialog.focus({preventScroll:true});
}
function openLB(i){
  if(!total||dialog.open)return;
  lastFocus=document.activeElement;openedIdx=i;
  ensureRendered(i+1);
  var cell=grid.querySelector('.cell[data-idx="'+i+'"]'),thumb=cell?cell.querySelector('img'):null;
  navTo(i,true);
  var show=function(){
    if(thumb)thumb.style.viewTransitionName='wall';
    vt(function(){
      if(thumb)thumb.style.viewTransitionName='';
      lbImg.style.viewTransitionName='wall';
      openDialog();
    });
  };
  if(lbImg.decode)lbImg.decode().then(show,show);else show();
}
function closeLB(){
  if(!dialog.open||closing)return;
  closing=true;abortDL();navToken++;
  var idx=cur,changed=idx!==openedIdx;
  ensureRendered(idx+1);
  var cell=grid.querySelector('.cell[data-idx="'+idx+'"]'),thumb=cell?cell.querySelector('img'):null;
  if(changed&&cell)cell.scrollIntoView({block:'center',behavior:'auto'});
  var finish=function(){
    lbImg.style.viewTransitionName='wall';
    vt(function(){
      lbImg.style.viewTransitionName='';
      if(thumb)thumb.style.viewTransitionName='wall';
      try{dialog.close()}catch(_){dialog.removeAttribute('open')}
    });
  };
  var wait=(thumb&&!thumb.complete)?new Promise(function(res){
    thumb.addEventListener('load',res,{once:true});thumb.addEventListener('error',res,{once:true});setTimeout(res,450);
  }):Promise.resolve();
  wait.then(function(){requestAnimationFrame(function(){requestAnimationFrame(finish)})});
}
dialog.addEventListener('cancel',function(e){
  e.preventDefault();
  if(document.fullscreenElement||document.webkitFullscreenElement){exitFS();return}
  closeLB();
});
dialog.addEventListener('close',function(){
  closing=false;
  document.body.classList.remove('locked');
  exitFS();clearHash();resetZoom();
  lbImg.classList.add('fade');stage.classList.remove('loading');
  setStatus('',false);setAmbient(null);
  pts.clear();gest=null;
  var idx=cur,cell=grid.querySelector('.cell[data-idx="'+idx+'"]');
  if(idx!==openedIdx&&cell){
    cell.classList.add('peek');setTimeout(function(){cell.classList.remove('peek')},1800);
    cell.focus({preventScroll:true});
  }else if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});
  lastFocus=null;
  setTimeout(function(){if(!dialog.open)lbImg.removeAttribute('src')},500);
});
$('#closeBtn').addEventListener('click',closeLB);
$('#prevBtn').addEventListener('click',function(){navTo(cur-1)});
$('#nextBtn').addEventListener('click',function(){navTo(cur+1)});

/* ---------- клавиатура ---------- */
dialog.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'){e.preventDefault();navTo(cur-1);return}
  if(e.key==='ArrowRight'){e.preventDefault();navTo(cur+1);return}
  var k=e.key.toLowerCase();
  if(k==='f'||k==='а'){e.preventDefault();if(fsOK)toggleFS()}
  else if(k==='d'||k==='в'){e.preventDefault();if(!dl.busy){if(dl.cors)window.open(entries[cur].url,'_blank','noopener');else startDownload()}}
  else if(k==='0'||k==='escape'&&z.s>1.02){if(k==='0'){e.preventDefault();smooth();resetZoom()}}
  else if(k==='+'||k==='='){e.preventDefault();smooth();var r=lbImg.getBoundingClientRect();setZoom(z.s*1.4,r.left+r.width/2,r.top+r.height/2)}
  else if(k==='-'||k==='_'){e.preventDefault();smooth();var r2=lbImg.getBoundingClientRect();setZoom(z.s/1.4,r2.left+r2.width/2,r2.top+r2.height/2)}
});

/* ---------- полный экран ---------- */
var fsOK=!!(dialog.requestFullscreen||dialog.webkitRequestFullscreen);
if(!fsOK)fsBtn.hidden=true;
function exitFS(){
  if(document.fullscreenElement||document.webkitFullscreenElement){
    try{var f=document.exitFullscreen||document.webkitExitFullscreen;if(f)f.call(document)}catch(_){}
  }
}
function toggleFS(){
  if(document.fullscreenElement||document.webkitFullscreenElement){exitFS();return}
  try{var f=dialog.requestFullscreen||dialog.webkitRequestFullscreen;if(f)f.call(dialog)}catch(_){}
}
function syncFS(){
  var on=!!(document.fullscreenElement||document.webkitFullscreenElement);
  fsIcon.setAttribute('href',on?'#i-comp':'#i-exp');
  var l=on?'Выйти из полного экрана':'Полный экран';
  fsBtn.title=l+' (F)';fsBtn.setAttribute('aria-label',l);
}
fsBtn.addEventListener('click',toggleFS);
document.addEventListener('fullscreenchange',syncFS);
document.addEventListener('webkitfullscreenchange',syncFS);

/* ---------- скачивание с прогрессом и CORS-фолбэком ---------- */
dlBtn.addEventListener('click',function(e){
  if(dl.cors)return;
  e.preventDefault();
  if(!dl.busy)startDownload();
});
function startDownload(){
  var e=entries[cur],token=navToken;
  dl.busy=true;setDlState('loading',0);
  var ctrl=new AbortController();dl.ctrl=ctrl;
  fetch(e.url,{signal:ctrl.signal,mode:'cors',credentials:'omit'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    var len=parseInt(r.headers.get('content-length')||'0',10);
    if(!r.body||!len||!r.body.getReader)return r.blob();
    var reader=r.body.getReader(),chunks=[],got=0,last=-1;
    function pump(){
      return reader.read().then(function(res){
        if(res.done)return new Blob(chunks,{type:r.headers.get('content-type')||'image/jpeg'});
        chunks.push(res.value);got+=res.value.length;
        var p=Math.min(99,Math.round(got/len*100));
        if(p!==last&&token===navToken){last=p;setDlState('loading',p)}
        return pump();
      });
    }
    return pump();
  }).then(function(blob){
    if(ctrl.signal.aborted||token!==navToken)return;
    var u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=e.img_id+'_UHD.jpg';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},5000);
    if(token===navToken){
      setDlState('success');
      setTimeout(function(){if(token===navToken&&!dl.busy)setDlState(dl.cors?'open':'idle')},1700);
    }
  }).catch(function(){
    if(ctrl.signal.aborted||token!==navToken)return;
    dl.cors=true;setDlState('open');
    window.open(e.url,'_blank','noopener');
  }).then(function(){if(dl.ctrl===ctrl)dl.ctrl=null;dl.busy=false});
}

/* ---------- старт ---------- */
boot();onScroll();
})();
</script>
