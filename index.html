<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Личный архив Bing Wallpaper UHD">
    <meta name="theme-color" content="#141517">
    <title>Горизонт | Архив Bing</title>
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="canonical" href="https://gorizont.isvii.ru/">
    <link rel="dns-prefetch" href="https://www.bing.com">
    <link rel="preconnect" href="https://www.bing.com">
    <link rel="preload" href="data.json" as="fetch" crossorigin="anonymous">

    <meta property="og:title" content="Горизонт | Архив Bing">
    <meta property="og:description" content="Коллекция лучших обоев Bing в формате UHD.">
    <meta property="og:url" content="https://gorizont.isvii.ru/">
    <meta property="og:image" content="https://gorizont.isvii.ru/favicon.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <style>
        :root {
            --bg-start: #2a2d32;
            --bg-end: #141517;
            --card-bg: #22252a;
            --text: #fff;
            --text-muted: #c7c7c7;
            --overlay: rgba(10, 10, 12, 0.92);
            --accent: #0071e3;
            --glass-bg: rgba(44, 44, 46, 0.65);
            --glass-hover: rgba(68, 68, 72, 0.78);
            --glass-border: rgba(255, 255, 255, 0.12);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            --radius: 12px;
        }

        * { box-sizing: border-box; }

        html {
            scrollbar-gutter: stable;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
            background: radial-gradient(circle at center, var(--bg-start) 0%, var(--bg-end) 100%);
        }

        h1 {
            margin: 24px 0 32px;
            padding-left: 0.6em;
            text-align: center;
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 0.6em;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(max(360px, calc((100% - 96px) / 5)), 1fr));
            gap: 24px;
        }

        .card {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            padding: 0;
            overflow: hidden;
            border: 0;
            border-radius: var(--radius);
            background: var(--card-bg);
            box-shadow: var(--shadow);
            cursor: pointer;
            content-visibility: auto;
            contain-intrinsic-size: auto 200px;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .card:hover {
            outline: none;
            transform: scale(1.02);
        }

        .card:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
            transform: scale(1.02);
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.04) 50%,
                transparent 100%
            );
            transform: translateX(-100%);
            animation: shimmer 1.8s infinite ease-in-out;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .card.is-loaded::before {
            opacity: 0;
            animation: none;
        }

        .card img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .card img.loaded { opacity: 1; }

        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto;
            border: none;
            background: transparent;
            width: 100%;
            height: 100%;
            padding: 0;
            max-width: none;
            max-height: none;
        }

        .lightbox[open] {
            display: flex;
        }

        .lightbox::backdrop {
            background: var(--overlay);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
        }

        .lightbox img {
            width: 98%;
            height: 88%;
            max-width: 98%;
            max-height: 88%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .close,
        .nav-btn {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            margin: 0;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: var(--glass-bg);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35), inset 0 0.5px 0 0 var(--glass-border);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease;
        }

        .close {
            top: 24px;
            right: 24px;
        }

        .nav-btn {
            top: 50%;
            transform: translateY(-50%);
        }

        .nav-btn.prev { left: 24px; }
        .nav-btn.next { right: 24px; }

        .close svg,
        .nav-btn svg {
            display: block;
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-btn.prev svg { transform: translateX(-1px); }
        .nav-btn.next svg { transform: translateX(1px); }

        .close:hover,
        .close:focus-visible,
        .nav-btn:hover,
        .nav-btn:focus-visible {
            outline: none;
            background: var(--glass-hover);
            color: #fff;
        }

        .close:hover { transform: scale(1.06); }
        .close:active { transform: scale(0.95); }

        .nav-btn:hover { transform: translateY(-50%) scale(1.06); }
        .nav-btn:active { transform: translateY(-50%) scale(0.95); }

        .close:focus-visible,
        .nav-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .nav-btn:disabled {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .controls { margin-top: 18px; }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 42px;
            padding: 0 22px;
            color: rgba(255, 255, 255, 0.92);
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -0.01em;
            border: none;
            border-radius: 999px;
            background: var(--glass-bg);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35), inset 0 0.5px 0 0 var(--glass-border);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .action-btn:hover,
        .action-btn:focus-visible {
            outline: none;
            background: var(--glass-hover);
            color: #fff;
            transform: scale(1.03);
        }

        .action-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .action-btn:active { transform: scale(0.97); }
        .action-btn.loading { opacity: 0.6; pointer-events: none; }
        .status { color: var(--text-muted); text-align: center; }

        @media (max-width: 600px) {
            body { padding: 14px; }
            h1 { margin: 20px 0 24px; font-size: 26px; letter-spacing: 0.35em; padding-left: 0.35em; }
            .grid { grid-template-columns: 1fr; }
            .close { top: 14px; right: 14px; width: 40px; height: 40px; }
            .nav-btn { width: 40px; height: 40px; }
            .nav-btn.prev { left: 10px; }
            .nav-btn.next { right: 10px; }
            .controls { width: 100%; padding: 0 20px; display: flex; justify-content: center; }
            .controls .action-btn { width: 100%; max-width: 260px; }
        }
    </style>
</head>

<body>
    <h1>Горизонт</h1>

    <main class="grid" id="gallery" aria-busy="true"></main>

    <noscript>
        <p class="status">Для работы архива необходим JavaScript.</p>
    </noscript>

    <dialog class="lightbox" id="viewer" aria-label="Просмотр обоев">
        <button class="close" id="close" type="button" aria-label="Закрыть просмотр">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M17 7L7 17M7 7l10 10"></path>
            </svg>
        </button>

        <button class="nav-btn prev" id="prev" type="button" aria-label="Предыдущее изображение">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14.5 6.5L9 12l5.5 5.5"></path>
            </svg>
        </button>
        <button class="nav-btn next" id="next" type="button" aria-label="Следующее изображение">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9.5 6.5L15 12l-5.5 5.5"></path>
            </svg>
        </button>

        <img id="bigImage" alt="" referrerpolicy="no-referrer">

        <div class="controls">
            <button class="action-btn" id="download" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"></path>
                </svg>
                <span id="downloadText">Скачать UHD</span>
            </button>
        </div>
    </dialog>

    <script>
        'use strict';

        const gallery = document.getElementById('gallery');
        const viewer = document.getElementById('viewer');
        const bigImage = document.getElementById('bigImage');
        const downloadBtn = document.getElementById('download');
        const downloadText = document.getElementById('downloadText');
        const closeBtn = document.getElementById('close');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');

        const PAGE_SIZE = 40;

        let galleryItems = [];
        let renderedCount = 0;
        let currentIndex = -1;
        let blobURL = null;
        let loadToken = 0;
        let previouslyFocused = null;
        let downloadFallbackItem = null;
        let downloadController = null;
        let sentinelObserver = null;
        const preloadedUHD = new Set();

        function setDownloadState(label, isLoading = false) {
            downloadText.textContent = label;
            downloadBtn.classList.toggle('loading', isLoading);
        }

        function releaseBlobURL() {
            if (blobURL) {
                URL.revokeObjectURL(blobURL);
                blobURL = null;
            }
        }

        function cancelDownload() {
            if (downloadController) {
                downloadController.abort();
                downloadController = null;
            }
        }

        async function downloadImage(item) {
            if (!item?.url) return;

            cancelDownload();

            const controller = new AbortController();
            downloadController = controller;
            downloadFallbackItem = null;
            setDownloadState('Загрузка...', true);

            try {
                const response = await fetch(item.url, {
                    referrerPolicy: 'no-referrer',
                    signal: controller.signal,
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const blob = await response.blob();

                releaseBlobURL();
                blobURL = URL.createObjectURL(blob);

                const link = document.createElement('a');
                link.href = blobURL;
                link.download = `${item.img_id || 'BING_IMAGE'}.jpg`;
                document.body.appendChild(link);
                link.click();
                link.remove();

                setDownloadState('Скачать UHD');
            } catch (error) {
                if (error.name === 'AbortError') return;
                downloadFallbackItem = item;
                setDownloadState('Открыть UHD');
            } finally {
                if (downloadController === controller) {
                    downloadController = null;
                    downloadBtn.classList.remove('loading');
                }
            }
        }

        function preloadUHD(url) {
            if (!url || preloadedUHD.has(url)) return;
            preloadedUHD.add(url);
            const img = new Image();
            img.referrerPolicy = 'no-referrer';
            img.src = url;
        }

        function openViewer(index) {
            const item = galleryItems[index];
            if (!item) return;

            currentIndex = index;
            downloadFallbackItem = null;
            cancelDownload();

            if (!viewer.open) {
                previouslyFocused = document.activeElement;
                viewer.showModal();
                document.body.style.overflow = 'hidden';
            }

            const isFirst = index <= 0;
            const isLast = index >= galleryItems.length - 1;

            if (isLast && document.activeElement === nextBtn) {
                (!isFirst ? prevBtn : closeBtn).focus();
            } else if (isFirst && document.activeElement === prevBtn) {
                (!isLast ? nextBtn : closeBtn).focus();
            } else if (document.activeElement !== nextBtn && document.activeElement !== prevBtn) {
                closeBtn.focus();
            }

            prevBtn.disabled = isFirst;
            nextBtn.disabled = isLast;

            const token = ++loadToken;
            bigImage.alt = item.img_id || 'Обои Bing';
            bigImage.style.opacity = '0';
            setDownloadState('Загрузка...', true);

            const targetSrc = item.url || item.preview;

            bigImage.onload = () => {
                if (token !== loadToken) return;
                bigImage.style.opacity = '1';
                setDownloadState('Скачать UHD');
                if (galleryItems[index + 1]?.url) preloadUHD(galleryItems[index + 1].url);
                if (galleryItems[index - 1]?.url) preloadUHD(galleryItems[index - 1].url);
            };

            bigImage.onerror = () => {
                if (token !== loadToken) return;
                if (bigImage.src !== item.preview && item.preview) {
                    bigImage.src = item.preview;
                } else {
                    setDownloadState('Ошибка загрузки', true);
                }
            };

            bigImage.src = targetSrc;
        }

        function closeViewer() {
            if (viewer.open) viewer.close();
        }

        function navigate(direction) {
            const next = currentIndex + direction;
            if (next < 0 || next >= galleryItems.length) return;
            openViewer(next);
        }

        function createCard(item, index) {
            const card = document.createElement('button');
            card.className = 'card';
            card.type = 'button';
            card.setAttribute('aria-label', `Открыть ${item.img_id || 'обои'}`);

            const img = document.createElement('img');
            img.alt = '';
            img.setAttribute('aria-hidden', 'true');
            img.decoding = 'async';
            img.referrerPolicy = 'no-referrer';

            if (index < 15) {
                img.loading = 'eager';
                img.fetchPriority = 'high';
            } else {
                img.loading = 'lazy';
            }

            const primarySrc = item.preview || item.url;
            let retries = 0;

            img.addEventListener('load', () => {
                img.classList.add('loaded');
                card.classList.add('is-loaded');
            }, { once: true });

            img.addEventListener('error', () => {
                if (retries < 2) {
                    retries++;
                    setTimeout(() => {
                        const current = img.src;
                        if (current.includes('/th/id/')) {
                            img.src = current.replace('/th/id/', '/th?id=');
                        } else if (current.includes('/th?id=')) {
                            img.src = current.replace('/th?id=', '/th/id/');
                        } else {
                            img.src = primarySrc;
                        }
                    }, 600 * retries);
                } else {
                    img.classList.add('loaded');
                    card.classList.add('is-loaded');
                }
            });

            img.src = primarySrc;

            card.append(img);
            card.addEventListener('pointerenter', () => preloadUHD(item.url), { once: true });
            card.addEventListener('click', () => openViewer(index));
            return card;
        }

        function renderNextBatch() {
            if (renderedCount >= galleryItems.length) return;

            const nextBatch = galleryItems.slice(renderedCount, renderedCount + PAGE_SIZE);
            const fragment = document.createDocumentFragment();

            nextBatch.forEach((item, offset) => {
                fragment.append(createCard(item, renderedCount + offset));
            });

            renderedCount += nextBatch.length;

            const sentinel = document.getElementById('gallery-sentinel');
            if (sentinel) {
                gallery.insertBefore(fragment, sentinel);
                if (renderedCount >= galleryItems.length) {
                    sentinel.remove();
                    if (sentinelObserver) sentinelObserver.disconnect();
                }
            } else {
                gallery.append(fragment);
            }
        }

        function setupInfiniteScroll() {
            if (sentinelObserver) sentinelObserver.disconnect();

            const sentinel = document.createElement('div');
            sentinel.id = 'gallery-sentinel';
            sentinel.style.width = '100%';
            sentinel.style.height = '60px';
            sentinel.style.gridColumn = '1 / -1';
            gallery.append(sentinel);

            sentinelObserver = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    renderNextBatch();
                }
            }, { rootMargin: '300px 0px' });

            sentinelObserver.observe(sentinel);
        }

        function renderGallery(data) {
            const rawItems = Array.isArray(data) ? data : Object.values(data || {});
            const validItems = [];

            for (let i = 0; i < rawItems.length; i++) {
                const item = rawItems[i];
                if (item && (item.url || item.preview)) {
                    validItems.push({
                        img_id: item.img_id,
                        url: item.url ? item.url.replace('/th?id=', '/th/id/') : '',
                        preview: item.preview ? item.preview.replace('/th?id=', '/th/id/') : '',
                    });
                }
            }

            galleryItems = validItems;
            gallery.setAttribute('aria-busy', 'false');

            if (!validItems.length) {
                gallery.innerHTML = '<p class="status">Архив пока пуст.</p>';
                return;
            }

            renderedCount = 0;
            gallery.replaceChildren();
            renderNextBatch();

            if (validItems.length > PAGE_SIZE) {
                setupInfiniteScroll();
            }
        }

        async function loadGallery() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                renderGallery(data);
            } catch (error) {
                console.error('Не удалось загрузить архив:', error);
                gallery.setAttribute('aria-busy', 'false');
                gallery.innerHTML = '<p class="status">Ошибка загрузки архива.</p>';
            }
        }

        downloadBtn.addEventListener('click', () => {
            if (downloadFallbackItem?.url) {
                window.open(downloadFallbackItem.url, '_blank', 'noopener,noreferrer');
                return;
            }
            if (currentIndex >= 0) {
                downloadImage(galleryItems[currentIndex]);
            }
        });

        closeBtn.addEventListener('click', closeViewer);
        prevBtn.addEventListener('click', () => navigate(-1));
        nextBtn.addEventListener('click', () => navigate(1));

        let touchStartX = 0;
        let touchStartY = 0;

        viewer.addEventListener('touchstart', event => {
            if (event.touches.length === 1) {
                touchStartX = event.touches[0].clientX;
                touchStartY = event.touches[0].clientY;
            }
        }, { passive: true });

        viewer.addEventListener('touchend', event => {
            if (!viewer.open || event.changedTouches.length === 0) return;
            const deltaX = event.changedTouches[0].clientX - touchStartX;
            const deltaY = event.changedTouches[0].clientY - touchStartY;

            if (Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
                navigate(deltaX < 0 ? 1 : -1);
            }
        }, { passive: true });

        viewer.addEventListener('click', event => {
            if (event.target === viewer) closeViewer();
        });

        viewer.addEventListener('close', () => {
            ++loadToken;
            cancelDownload();
            releaseBlobURL();

            document.body.style.overflow = '';

            bigImage.removeAttribute('src');
            bigImage.style.opacity = '0';

            currentIndex = -1;
            downloadFallbackItem = null;
            setDownloadState('Скачать UHD');

            if (previouslyFocused && document.contains(previouslyFocused)) {
                previouslyFocused.focus();
            }
            previouslyFocused = null;
        });

        document.addEventListener('keydown', event => {
            if (!viewer.open) return;
            if (event.key === 'ArrowLeft') navigate(-1);
            if (event.key === 'ArrowRight') navigate(1);
        });

        window.addEventListener('beforeunload', () => {
            cancelDownload();
            releaseBlobURL();
        });

        loadGallery();
    </script>
</body>
</html>
