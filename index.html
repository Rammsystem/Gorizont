<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Личный архив Bing Wallpaper UHD">
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
    <title>Горизонт | Архив Bing</title>
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="canonical" href="https://gorizont.isvii.ru/">
    <link rel="dns-prefetch" href="https://www.bing.com">
    <link rel="preconnect" href="https://www.bing.com">
    <link rel="preload" href="data.json" as="fetch" crossorigin="anonymous">

    <meta property="og:title" content="Горизонт | Архив Bing">
    <meta property="og:description" content="Коллекция лучших обоев Bing в формате UHD.">
    <meta property="og:url" content="https://gorizont.isvii.ru/">
    <meta property="og:image" content="https://gorizont.isvii.ru/favicon.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <style>
        :root {
            color-scheme: light dark;
            --bg: #fafafa;
            --surface: #ececec;
            --text: #161616;
            --muted: #707070;
            --line: #e2e2e2;
            --gap: 8px;
            --pad: clamp(12px, 2.2vw, 32px);
            --radius: 6px;
            --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #141414;
                --surface: #1f1f1f;
                --text: #ededed;
                --muted: #8a8a8a;
                --line: #262626;
            }
        }

        * { box-sizing: border-box; }

        html {
            scrollbar-gutter: stable;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: var(--bg);
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 0 var(--pad) var(--pad);
            color: var(--text);
            background: var(--bg);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .top {
            display: flex;
            align-items: center;
            height: 72px;
            margin-bottom: var(--pad);
            border-bottom: 1px solid var(--line);
        }

        h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
            gap: var(--gap);
        }

        .card {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            padding: 0;
            overflow: hidden;
            border: 0;
            border-radius: var(--radius);
            background: var(--surface);
            cursor: pointer;
            content-visibility: auto;
            contain-intrinsic-size: auto 200px;
        }

        .card img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.6s var(--ease);
        }

        .card img.loaded { opacity: 1; }

        @media (hover: hover) {
            .grid:hover .card img.loaded { opacity: 0.55; }
            .grid .card:hover img.loaded,
            .grid .card:focus-visible img.loaded { opacity: 1; }
            .card img { transition-duration: 0.3s; }
        }

        .card:focus-visible {
            outline: 2px solid var(--text);
            outline-offset: 3px;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 1000;
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            margin: 0;
            padding: 24px 80px 88px;
            border: 0;
            background: transparent;
            color: #fff;
        }

        .lightbox[open] { display: grid; }

        .lightbox::backdrop {
            background: rgba(10, 10, 10, 0.96);
        }

        .lightbox img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .close,
        .nav-btn {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            margin: 0;
            padding: 0;
            border: 0;
            background: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.5));
            transition: color 0.2s ease, opacity 0.2s ease;
        }

        .close { top: 16px; right: 16px; }
        .nav-btn { top: 50%; margin-top: -24px; }
        .nav-btn.prev { left: 16px; }
        .nav-btn.next { right: 16px; }

        .close svg,
        .nav-btn svg {
            display: block;
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .close:hover,
        .nav-btn:hover { color: #fff; }

        .close:focus-visible,
        .nav-btn:focus-visible,
        .action-btn:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
            color: #fff;
        }

        .nav-btn:disabled {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: max(24px, env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 24px;
            color: #fff;
            font: inherit;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            cursor: pointer;
            transition: background-color 0.2s ease, opacity 0.2s ease;
        }

        .action-btn:hover { background: rgba(255, 255, 255, 0.16); }
        .action-btn.loading { opacity: 0.5; pointer-events: none; }

        .status { color: var(--muted); text-align: center; grid-column: 1 / -1; padding: 48px 0; }

        @media (max-width: 600px) {
            :root { --gap: 6px; }
            .top { height: 60px; }
            h1 { font-size: 18px; }
            .lightbox { padding: 64px 0 88px; }
            .close { top: 8px; right: 8px; }
            .nav-btn.prev { left: 4px; }
            .nav-btn.next { right: 4px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; }
        }
    
</style>
</head>

<body>
    <header class="top">
        <h1>Горизонт</h1>
    </header>

    <main class="grid" id="gallery" aria-busy="true"></main>

    <noscript>
        <p class="status">Для работы архива необходим JavaScript.</p>
    </noscript>

    <dialog class="lightbox" id="viewer" aria-label="Просмотр обоев">
        <button class="close" id="close" type="button" aria-label="Закрыть просмотр">
            <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M16 4L4 16M4 4l12 12"></path>
            </svg>
        </button>

        <button class="nav-btn prev" id="prev" type="button" aria-label="Предыдущее изображение">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14.5 6.5L9 12l5.5 5.5"></path>
            </svg>
        </button>
        <button class="nav-btn next" id="next" type="button" aria-label="Следующее изображение">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9.5 6.5L15 12l-5.5 5.5"></path>
            </svg>
        </button>

        <img id="bigImage" alt="" referrerpolicy="no-referrer" fetchpriority="high">

        <div class="controls">
            <button class="action-btn" id="download" type="button">Скачать UHD</button>
        </div>
    </dialog>

    <script>
        'use strict';

        const gallery = document.getElementById('gallery');
        const viewer = document.getElementById('viewer');
        const bigImage = document.getElementById('bigImage');
        const downloadBtn = document.getElementById('download');
        const closeBtn = document.getElementById('close');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');

        const PAGE_SIZE = 40;

        let galleryItems = [];
        let renderedCount = 0;
        let currentIndex = -1;
        let blobURL = null;
        let loadToken = 0;
        let previouslyFocused = null;
        let downloadFallbackItem = null;
        let downloadController = null;
        let sentinelObserver = null;
        let activeUhdLoader = null;
        const preloadedUHD = new Set();

        function setDownloadState(label, isLoading = false) {
            downloadBtn.textContent = label;
            downloadBtn.classList.toggle('loading', isLoading);
        }

        function releaseBlobURL() {
            if (blobURL) {
                URL.revokeObjectURL(blobURL);
                blobURL = null;
            }
        }

        function cancelDownload() {
            if (downloadController) {
                downloadController.abort();
                downloadController = null;
            }
        }

        function cancelUhdLoader() {
            if (activeUhdLoader) {
                activeUhdLoader.onload = null;
                activeUhdLoader.onerror = null;
                activeUhdLoader.src = '';
                activeUhdLoader = null;
            }
        }

        async function downloadImage(item) {
            if (!item?.url) return;

            cancelDownload();

            const controller = new AbortController();
            downloadController = controller;
            downloadFallbackItem = null;
            setDownloadState('Загрузка…', true);

            try {
                const response = await fetch(item.url, {
                    referrerPolicy: 'no-referrer',
                    signal: controller.signal,
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const blob = await response.blob();

                releaseBlobURL();
                blobURL = URL.createObjectURL(blob);

                const link = document.createElement('a');
                link.href = blobURL;
                link.download = `${item.img_id || 'BING_IMAGE'}.jpg`;
                document.body.appendChild(link);
                link.click();
                link.remove();

                setDownloadState('Скачать UHD');
            } catch (error) {
                if (error.name === 'AbortError') return;
                downloadFallbackItem = item;
                setDownloadState('Открыть UHD');
            } finally {
                if (downloadController === controller) {
                    downloadController = null;
                    downloadBtn.classList.remove('loading');
                }
            }
        }

        function preloadUHD(url) {
            if (!url || preloadedUHD.has(url)) return;
            preloadedUHD.add(url);
            const img = new Image();
            img.referrerPolicy = 'no-referrer';
            img.fetchPriority = 'low';
            img.src = url;
        }

        function openViewer(index) {
            const item = galleryItems[index];
            if (!item) return;

            currentIndex = index;
            downloadFallbackItem = null;
            cancelDownload();
            cancelUhdLoader();

            if (!viewer.open) {
                previouslyFocused = document.activeElement;
                viewer.showModal();
                document.body.style.overflow = 'hidden';
            }

            const isFirst = index <= 0;
            const isLast = index >= galleryItems.length - 1;

            if (isLast && document.activeElement === nextBtn) {
                (!isFirst ? prevBtn : closeBtn).focus();
            } else if (isFirst && document.activeElement === prevBtn) {
                (!isLast ? nextBtn : closeBtn).focus();
            } else if (document.activeElement !== nextBtn && document.activeElement !== prevBtn) {
                closeBtn.focus();
            }

            prevBtn.disabled = isFirst;
            nextBtn.disabled = isLast;

            const token = ++loadToken;
            bigImage.alt = item.img_id || 'Обои Bing';
            bigImage.fetchPriority = 'high';

            // Если есть и превью, и UHD — мгновенно показываем превью из кэша, а UHD грузим с высоким приоритетом
            if (item.preview && item.url && item.preview !== item.url) {
                bigImage.onload = null;
                bigImage.onerror = null;
                bigImage.src = item.preview;
                bigImage.style.opacity = '1';
                setDownloadState('Скачать UHD');

                const uhdLoader = new Image();
                activeUhdLoader = uhdLoader;
                uhdLoader.referrerPolicy = 'no-referrer';
                uhdLoader.fetchPriority = 'high';
                uhdLoader.decoding = 'async';

                uhdLoader.onload = () => {
                    if (token !== loadToken) return;
                    activeUhdLoader = null;
                    bigImage.src = item.url;
                    preloadedUHD.add(item.url);
                    if (galleryItems[index + 1]?.url) preloadUHD(galleryItems[index + 1].url);
                    if (galleryItems[index - 1]?.url) preloadUHD(galleryItems[index - 1].url);
                };

                uhdLoader.onerror = () => {
                    if (token !== loadToken) return;
                    activeUhdLoader = null;
                };

                uhdLoader.src = item.url;
            } else {
                bigImage.style.opacity = '0';
                setDownloadState('Загрузка…', true);

                const targetSrc = item.url || item.preview;

                bigImage.onload = () => {
                    if (token !== loadToken) return;
                    bigImage.style.opacity = '1';
                    setDownloadState('Скачать UHD');
                    if (galleryItems[index + 1]?.url) preloadUHD(galleryItems[index + 1].url);
                    if (galleryItems[index - 1]?.url) preloadUHD(galleryItems[index - 1].url);
                };

                bigImage.onerror = () => {
                    if (token !== loadToken) return;
                    if (bigImage.src !== item.preview && item.preview) {
                        bigImage.src = item.preview;
                    } else {
                        setDownloadState('Ошибка загрузки', true);
                    }
                };

                bigImage.src = targetSrc;
            }
        }

        function closeViewer() {
            if (viewer.open) viewer.close();
        }

        function navigate(direction) {
            const next = currentIndex + direction;
            if (next < 0 || next >= galleryItems.length) return;
            openViewer(next);
        }

        function createCard(item, index) {
            const card = document.createElement('button');
            card.className = 'card';
            card.type = 'button';
            card.setAttribute('aria-label', `Открыть ${item.img_id || 'обои'}`);

            const img = document.createElement('img');
            img.alt = '';
            img.setAttribute('aria-hidden', 'true');
            img.decoding = 'async';
            img.referrerPolicy = 'no-referrer';

            if (index < 6) {
                img.loading = 'eager';
                img.fetchPriority = index < 2 ? 'high' : 'auto';
            } else {
                img.loading = 'lazy';
            }

            const primarySrc = item.preview || item.url;
            let retries = 0;

            img.addEventListener('load', () => {
                img.classList.add('loaded');
            }, { once: true });

            img.addEventListener('error', () => {
                if (retries < 2) {
                    retries++;
                    setTimeout(() => {
                        const current = img.src;
                        if (current.includes('/th/id/')) {
                            img.src = current.replace('/th/id/', '/th?id=');
                        } else if (current.includes('/th?id=')) {
                            img.src = current.replace('/th?id=', '/th/id/');
                        } else {
                            img.src = primarySrc;
                        }
                    }, 600 * retries);
                } else {
                    img.classList.add('loaded');
                }
            });

            img.src = primarySrc;

            card.append(img);

            // Предзагружаем UHD только при осознанном наведении (задержка 300 мс),
            // чтобы при быстром скролле не забивать канал фоновыми 4K-файлами
            let hoverTimer = null;
            card.addEventListener('pointerenter', () => {
                if (preloadedUHD.has(item.url)) return;
                hoverTimer = setTimeout(() => {
                    hoverTimer = null;
                    preloadUHD(item.url);
                }, 300);
            });
            card.addEventListener('pointerleave', () => {
                if (hoverTimer) {
                    clearTimeout(hoverTimer);
                    hoverTimer = null;
                }
            });

            card.addEventListener('click', () => openViewer(index));
            return card;
        }

        function renderNextBatch() {
            if (renderedCount >= galleryItems.length) return;

            const nextBatch = galleryItems.slice(renderedCount, renderedCount + PAGE_SIZE);
            const fragment = document.createDocumentFragment();

            nextBatch.forEach((item, offset) => {
                fragment.append(createCard(item, renderedCount + offset));
            });

            renderedCount += nextBatch.length;

            const sentinel = document.getElementById('gallery-sentinel');
            if (sentinel) {
                gallery.insertBefore(fragment, sentinel);
                if (renderedCount >= galleryItems.length) {
                    sentinel.remove();
                    if (sentinelObserver) sentinelObserver.disconnect();
                }
            } else {
                gallery.append(fragment);
            }
        }

        function setupInfiniteScroll() {
            if (sentinelObserver) sentinelObserver.disconnect();

            const sentinel = document.createElement('div');
            sentinel.id = 'gallery-sentinel';
            sentinel.style.width = '100%';
            sentinel.style.height = '60px';
            sentinel.style.gridColumn = '1 / -1';
            gallery.append(sentinel);

            sentinelObserver = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    renderNextBatch();
                }
            }, { rootMargin: '300px 0px' });

            sentinelObserver.observe(sentinel);
        }

        function toThumb(url) {
            if (!url) return '';
            const sep = url.includes('?') ? '&' : '?';
            return url + sep + 'w=480&h=270&rs=1&c=7';
        }

        function renderGallery(data) {
            const rawItems = Array.isArray(data) ? data : Object.values(data || {});
            const validItems = [];

            for (let i = 0; i < rawItems.length; i++) {
                const item = rawItems[i];
                if (item && (item.url || item.preview)) {
                    validItems.push({
                        img_id: item.img_id,
                        url: item.url ? item.url.replace('/th?id=', '/th/id/') : '',
                        preview: item.preview
                            ? toThumb(item.preview.replace('/th?id=', '/th/id/'))
                            : (item.url ? toThumb(item.url.replace('/th?id=', '/th/id/')) : ''),
                    });
                }
            }

            galleryItems = validItems;
            gallery.setAttribute('aria-busy', 'false');

            if (!validItems.length) {
                gallery.innerHTML = '<p class="status">Архив пока пуст.</p>';
                return;
            }

            renderedCount = 0;
            gallery.replaceChildren();
            renderNextBatch();

            if (validItems.length > PAGE_SIZE) {
                setupInfiniteScroll();
            }
        }

        async function loadGallery() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                renderGallery(data);
            } catch (error) {
                console.error('Не удалось загрузить архив:', error);
                gallery.setAttribute('aria-busy', 'false');
                gallery.innerHTML = '<p class="status">Ошибка загрузки архива.</p>';
            }
        }

        downloadBtn.addEventListener('click', () => {
            if (downloadFallbackItem?.url) {
                window.open(downloadFallbackItem.url, '_blank', 'noopener,noreferrer');
                return;
            }
            if (currentIndex >= 0) {
                downloadImage(galleryItems[currentIndex]);
            }
        });

        closeBtn.addEventListener('click', closeViewer);
        prevBtn.addEventListener('click', () => navigate(-1));
        nextBtn.addEventListener('click', () => navigate(1));

        let touchStartX = 0;
        let touchStartY = 0;

        viewer.addEventListener('touchstart', event => {
            if (event.touches.length === 1) {
                touchStartX = event.touches[0].clientX;
                touchStartY = event.touches[0].clientY;
            }
        }, { passive: true });

        viewer.addEventListener('touchend', event => {
            if (!viewer.open || event.changedTouches.length === 0) return;
            const deltaX = event.changedTouches[0].clientX - touchStartX;
            const deltaY = event.changedTouches[0].clientY - touchStartY;

            if (Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
                navigate(deltaX < 0 ? 1 : -1);
            }
        }, { passive: true });

        viewer.addEventListener('click', event => {
            if (event.target === viewer) closeViewer();
        });

        viewer.addEventListener('close', () => {
            ++loadToken;
            cancelDownload();
            cancelUhdLoader();
            releaseBlobURL();

            document.body.style.overflow = '';

            bigImage.removeAttribute('src');
            bigImage.style.opacity = '0';

            currentIndex = -1;
            downloadFallbackItem = null;
            setDownloadState('Скачать UHD');

            if (previouslyFocused && document.contains(previouslyFocused)) {
                previouslyFocused.focus();
            }
            previouslyFocused = null;
        });

        document.addEventListener('keydown', event => {
            if (!viewer.open) return;
            if (event.key === 'ArrowLeft') navigate(-1);
            if (event.key === 'ArrowRight') navigate(1);
        });

        window.addEventListener('pagehide', () => {
            cancelDownload();
            cancelUhdLoader();
            releaseBlobURL();
        });

        loadGallery();
    </script>
</body>
</html>
