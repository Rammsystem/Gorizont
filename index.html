<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка загрузки картинок Bing</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 22px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #ddd; }
  .mark { width: 28px; font-size: 20px; text-align: center; }
  .name { flex: 1; }
  .name small { display: block; color: #777; word-break: break-all; }
  .res { width: 150px; text-align: right; font-variant-numeric: tabular-nums; }
  pre { background: #f3f3f3; padding: 12px; white-space: pre-wrap; border-radius: 8px; }
</style>
</head>
<body>
<h1>Проверка загрузки картинок Bing</h1>
<p>Страница пробует загрузить одну и ту же обоину разными способами. Откройте её без VPN, подождите несколько секунд и пришлите скриншот или текст из рамки внизу.</p>
<div id="list"></div>
<pre id="report">Идёт проверка…</pre>

<script>
const ID = 'OHR.SunsetPoint_JA-JP7278727628';
const tests = [
  { name: '1080p, без referrer (как на сайте)', url: `https://www.bing.com/th/id/${ID}_1920x1080.jpg`, rp: 'no-referrer' },
  { name: '1080p, обычный referrer', url: `https://www.bing.com/th/id/${ID}_1920x1080.jpg`, rp: '' },
  { name: 'Превью с параметрами (как сейчас на сайте)', url: `https://www.bing.com/th/id/${ID}_1920x1080.jpg?w=480&h=270&rs=1&c=7`, rp: 'no-referrer' },
  { name: 'Вариант адреса /th?id=', url: `https://www.bing.com/th?id=${ID}_1920x1080.jpg`, rp: 'no-referrer' },
  { name: 'UHD', url: `https://www.bing.com/th/id/${ID}_UHD.jpg`, rp: 'no-referrer' },
  { name: 'Эксперимент: другой сервер Bing (tse1.mm.bing.net), превью', url: `https://tse1.mm.bing.net/th?id=${ID}_1920x1080.jpg&w=480&h=270&c=7`, rp: 'no-referrer' },
  { name: 'Эксперимент: другой сервер Bing (tse2.mm.bing.net), 1080p', url: `https://tse2.mm.bing.net/th?id=${ID}_1920x1080.jpg`, rp: 'no-referrer' },
];

const list = document.getElementById('list');
const report = document.getElementById('report');
const lines = [];
let pending = tests.length;

tests.forEach((t, i) => {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<div class="mark">…</div><div class="name">${i + 1}. ${t.name}<small>${t.url}</small></div><div class="res">ждём</div>`;
  list.append(row);
  const mark = row.querySelector('.mark');
  const res = row.querySelector('.res');
  const started = performance.now();
  const img = new Image();
  img.referrerPolicy = t.rp;
  const done = ok => {
    const ms = Math.round(performance.now() - started);
    mark.textContent = ok ? '✅' : '❌';
    res.textContent = ok ? `${img.naturalWidth}×${img.naturalHeight}, ${ms} мс` : `ошибка, ${ms} мс`;
    lines.push(`${i + 1}. ${ok ? 'OK' : 'ОШИБКА'} — ${t.name}`);
    if (--pending === 0) {
      lines.sort();
      report.textContent = lines.join('\n');
    }
  };
  img.onload = () => done(true);
  img.onerror = () => done(false);
  setTimeout(() => { if (!img.complete) { img.src = ''; done(false); } }, 20000);
  img.src = t.url;
});
</script>
</body>
</html>
