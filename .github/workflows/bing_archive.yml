name: Bing Archive Auto-Update

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bing-archive-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Bing wallpapers
        run: python3 fetch_bing.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data.json index.html
          if git diff --cached --quiet; then
            echo "No changes"
            echo "Без изменений: архив актуален." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          NEW_COUNT=$(git diff --cached --numstat -- data.json | awk '{s+=$1} END {print s+0}')
          git commit -m "Update Bing archive (+${NEW_COUNT} lines)"
          git push -u origin HEAD || {
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push -u origin HEAD
          }
          echo "Архив обновлён: +${NEW_COUNT} строк в data.json." >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        run: echo "::error::Обновление архива не удалось — проверьте логи шага Fetch Bing wallpapers."
