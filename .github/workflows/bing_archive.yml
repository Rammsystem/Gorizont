name: Bing Archive Auto-Update

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bing-archive-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Bing wallpapers
        run: python3 fetch_bing.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          NEW_COUNT=$(git diff --cached --numstat | awk '{s+=$1} END {print s+0}')
          git commit -m "Update Bing archive (+${NEW_COUNT} lines)"

          git push -u origin HEAD || {
            git pull --rebase origin main && git push -u origin HEAD
          }
